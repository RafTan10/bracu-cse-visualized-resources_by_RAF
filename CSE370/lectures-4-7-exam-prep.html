<script>// CSE370 Lectures 4-7: content shared by the interactive page and the printable notes.
window.DATA = {
topics: [
{ id: 'con', n: 1, title: 'Database Constraints', src: 'Lecture 4 · Chapter 5',
  big: `A relational database stores data in <b>tables</b>. <b>Integrity constraints</b> are rules that every valid state of the database must obey, so that wrong data can never get in. Exam questions give you an operation and ask which rule it breaks and how to prevent that.`,
  concepts: [
  { h: 'Relational model vocabulary', html: `
    <table class="t"><tr><th>Formal word</th><th>Everyday word</th><th>Example</th></tr>
    <tr><td><b>Relation</b></td><td>Table</td><td>Student</td></tr>
    <tr><td><b>Attribute</b></td><td>Column (the header)</td><td>ID, Name, CGPA</td></tr>
    <tr><td><b>Tuple</b></td><td>Row: one real-world fact</td><td>(21093784, Sanjana, 3.99)</td></tr>
    <tr><td><b>Domain</b></td><td>The set of values a column may take</td><td>CGPA: a number from 0.00 to 4.00</td></tr>
    <tr><td><b>Relation schema</b></td><td>The description of the table</td><td>Student(<u>ID</u>, Name, Phone, Email, CGPA)</td></tr>
    <tr><td><b>Relation state</b></td><td>The rows stored at this moment</td><td>changes with every insert, delete, update</td></tr></table>
    <p>Rows have no order. Columns do: changing their order changes the schema. The model was proposed by <b>E. F. Codd</b> (IBM, 1970).</p>` },
  { h: 'Keys', html: `
    <table class="t"><tr><th>Key type</th><th>Meaning</th><th>Student(ID, Name, Email)</th></tr>
    <tr><td><b>Superkey</b></td><td>Any set of attributes whose values are unique for every row</td><td>{ID}, {Email}, {ID, Name}, {ID, Email}</td></tr>
    <tr><td><b>Key</b></td><td>A <i>minimal</i> superkey: remove any attribute and it is no longer unique</td><td>{ID}, {Email}. Not {ID, Name}</td></tr>
    <tr><td><b>Candidate key</b></td><td>Each key of the relation, when it has several</td><td>ID and Email</td></tr>
    <tr><td><b>Primary key</b></td><td>The candidate key chosen to identify rows. Underlined. Usually the smallest</td><td><u>ID</u></td></tr>
    <tr><td><b>Foreign key</b></td><td>Attribute(s) that refer to the primary key of another (or the same) relation</td><td>Grades.SID → Student.ID</td></tr></table>
    <p>A relation has exactly one primary key, but it may be <b>composite</b>: Grades(<u>SID</u>, <u>CCode</u>, Grade). In Grades, {SID, CCode} is both a superkey and a key.</p>` },
  { h: 'The four integrity constraints', html: `
    <table class="t"><tr><th>Constraint</th><th>Rule</th><th>Example violation</th><th>Enforce with</th></tr>
    <tr><td><b>Domain</b></td><td>Every value must come from the domain of its attribute (type, format, range), or be NULL if allowed</td><td>Age = -5; CCode = '370CSE'</td><td>Data type, NOT NULL, CHECK, application validation</td></tr>
    <tr><td><b>Key</b></td><td>No two tuples may have the same value for a key</td><td>Two students with ID 21093784</td><td>PRIMARY KEY; UNIQUE for other candidate keys</td></tr>
    <tr><td><b>Entity integrity</b></td><td>No primary key attribute may be NULL in any tuple</td><td>ID = NULL; CCode = NULL in Grades</td><td>PRIMARY KEY</td></tr>
    <tr><td><b>Referential integrity</b></td><td>A foreign key value must (1) exist as a primary key value in the referenced table, or (2) be NULL, only if the foreign key is not part of the primary key</td><td>Student.DeptID = 'BBS' with no such department</td><td>FOREIGN KEY ... REFERENCES ...</td></tr></table>
    <pre>CREATE TABLE Student (
  ID INT,
  Name VARCHAR(100) NOT NULL,           -- domain
  Email VARCHAR(100) UNIQUE,            -- key (candidate key)
  CGPA DECIMAL(3,2),
  Dept CHAR(3),
  PRIMARY KEY (ID),                     -- key + entity integrity
  FOREIGN KEY (Dept) REFERENCES Department(DeptID),   -- referential
  CHECK (CGPA >= 0.00 AND CGPA <= 4.00) -- domain
);</pre>` },
  { h: 'Which operation can violate what', html: `
    <table class="t"><tr><th>Operation</th><th>Domain</th><th>Key</th><th>Entity</th><th>Referential</th></tr>
    <tr><td><b>INSERT</b></td><td>can</td><td>can</td><td>can</td><td>can (new FK value does not exist)</td></tr>
    <tr><td><b>DELETE</b></td><td>never</td><td>never</td><td>never</td><td>can (the deleted row is referenced by others)</td></tr>
    <tr><td><b>UPDATE</b></td><td>can</td><td>can, if a key is changed</td><td>can, if a PK is set to NULL</td><td>can, if an FK is changed, or a referenced PK is changed</td></tr></table>
    <p><b>When a referenced row is deleted or its key updated</b>, the foreign key declaration says what happens:</p>
    <table class="t"><tr><th>Option</th><th>ON DELETE</th><th>ON UPDATE</th></tr>
    <tr><td><b>RESTRICT</b></td><td>The delete is not allowed</td><td>The update is not allowed</td></tr>
    <tr><td><b>CASCADE</b></td><td>Rows that reference it are deleted too</td><td>Rows that reference it get the new value</td></tr>
    <tr><td><b>SET NULL</b></td><td colspan="2">The foreign key in the referencing rows becomes NULL. Only possible if the FK is not part of the primary key there</td></tr></table>
    <pre>FOREIGN KEY (StudentID) REFERENCES Student(ID) ON DELETE CASCADE,
FOREIGN KEY (Code) REFERENCES Course(Code) ON UPDATE RESTRICT</pre>` },
  { h: 'Answer recipe for violation questions', html: `
    <ol><li><b>Name</b> every constraint that is violated (there can be two).</li>
    <li><b>Say why</b>: which value, which column, which table it should have matched.</li>
    <li><b>Say how to prevent it</b>: the declaration (data type, PRIMARY KEY, FOREIGN KEY, ON DELETE/UPDATE option) that makes the DBMS reject it.</li>
    <li>If nothing is violated, say so and give the reason (for example: the table is not referenced by any other table).</li></ol>
    <p><b>Check order</b> for an insert or update: domain → key → entity → referential. For a delete, only check who references the row.</p>` } ] },

{ id: 'map', n: 2, title: 'ER/EER to Relational Schema', src: 'Lecture 5 · Chapter 7',
  big: `Eight mapping steps turn any ER or EER diagram into tables. Entities come first (steps 1-2), then relationships (3-5, 7), multivalued attributes (6), and superclass/subclass structures (8). In the answer, underline every primary key and draw an arrow from every foreign key to the key it references.`,
  concepts: [
  { h: 'Steps 1 and 2: entities', html: `
    <table class="t"><tr><th>Step</th><th>What you do</th><th>Example</th></tr>
    <tr><td><b>1. Regular entity</b></td><td>One table. Simple attributes become columns. A composite attribute is replaced by its simple parts. Multivalued attributes wait for step 6. Derived attributes are not stored. Choose one key as primary key; if it is composite, underline all its parts.</td><td>Student(<u>ID</u>, Name, Email, DOB, City, House, Road, Zip)</td></tr>
    <tr><td><b>2. Weak entity</b></td><td>One table with its own attributes, plus the owner's primary key as a foreign key. Primary key = owner's key + partial key.</td><td>Section(<u>Code</u>, <u>Section_no</u>, RoomNo, Semester), Code → Course</td></tr></table>` },
  { h: 'Steps 3, 4, 5: binary relationships', html: `
    <table class="t"><tr><th>Step</th><th>Approach</th><th>What you do</th><th>Example</th></tr>
    <tr><td><b>3. N:M</b></td><td>Cross-referencing (always)</td><td>New table for the relationship. Both primary keys enter as foreign keys and together form its primary key. Relationship attributes go here.</td><td>Enrolls_in(<u>StudentID</u>, <u>Code</u>, grade)</td></tr>
    <tr><td><b>4. 1:N</b></td><td>Foreign key</td><td>Put the primary key of the 1 side into the table of the N side as a foreign key. Relationship attributes also go to the N side. (Cross-referencing would work but wastes space.)</td><td>Student(<u>ID</u>, Name, CGPA, PID, completedCredit), PID → Program</td></tr>
    <tr><td><b>5. 1:1</b></td><td>Foreign key (preferred)</td><td>Put one side's primary key into the other as a foreign key, on the side with <b>total participation</b>, to avoid NULLs. Relationship attributes go with it.</td><td>Department(<u>DID</u>, Name, Location, FacID, startDate), FacID → Faculty</td></tr>
    <tr><td></td><td>Merged relation</td><td>Merge both entities into one table. Suitable when both sides participate totally; otherwise it stores many NULLs.</td><td></td></tr>
    <tr><td></td><td>Cross-referencing</td><td>Same as step 3: a third table. Rarely needed.</td><td></td></tr></table>
    <p><b>Recursive relationships</b> follow the same rules as binary ones. N:M → new table with the key twice under two role names: Prerequisite_of(<u>prereq_Code</u>, <u>dependent_Code</u>). 1:N → one extra FK column in the same table: Course(<u>Code</u>, Title, Credits, prereq_Code). 1:1 → cross-referencing or foreign key approach.</p>` },
  { h: 'Steps 6 and 7', html: `
    <table class="t"><tr><th>Step</th><th>What you do</th><th>Example</th></tr>
    <tr><td><b>6. Multivalued attribute</b></td><td>A new table for each one. Columns: the owner's primary key (as FK) and the attribute. Both together are the primary key. If it is multivalued <i>and</i> composite, its simple parts are the columns; underline the partial key if one is shown, otherwise all parts.</td><td>Student_Phone(<u>ID</u>, <u>Phone</u>)<br>PreviousDegree(<u>ID</u>, <u>Year</u>, <u>DName</u>, institute)</td></tr>
    <tr><td><b>7. N-ary relationship</b></td><td>Always a new table. The primary key of every participating entity enters as a foreign key; all of them together form the primary key. Relationship attributes go here.</td><td>Enrolls_in(<u>StudentID</u>, <u>Code</u>, <u>SemName</u>, grade)</td></tr></table>` },
  { h: 'Step 8: specialization / generalization (EER)', html: `
    <p>Example: Student(ID, Name, CGPA) with subclasses Undergrad(NID) and Postgrad(major).</p>
    <table class="t"><tr><th>Option</th><th>Tables</th><th>Example</th><th>Works for</th></tr>
    <tr><td><b>8A</b> Superclass + subclasses</td><td>One table for the superclass and one per subclass. Each subclass table has the superclass key as its primary key and as a foreign key.</td><td>Student(<u>ID</u>, Name, CGPA)<br>Undergrad(<u>ID</u>, NID)<br>Postgrad(<u>ID</u>, major)</td><td>Everything: disjoint/overlapping, total/partial</td></tr>
    <tr><td><b>8B</b> Subclasses only</td><td>One table per subclass, each with all superclass attributes. No superclass table.</td><td>Undergrad(<u>ID</u>, Name, CGPA, NID)<br>Postgrad(<u>ID</u>, Name, CGPA, major)</td><td><b>Total only.</b> If partial, members in no subclass are lost</td></tr>
    <tr><td><b>8C</b> One table, one type attribute</td><td>All attributes of superclass and subclasses in one table, plus one type column (the discriminator).</td><td>Student(<u>ID</u>, Name, CGPA, NID, major, StudentType)</td><td><b>Disjoint only.</b> One type value cannot record several subclasses</td></tr>
    <tr><td><b>8D</b> One table, many flags</td><td>One table, plus one boolean flag per subclass.</td><td>Student(<u>ID</u>, Name, CGPA, NID, major, UFlag, PFlag)</td><td>Everything, but wasteful for disjoint (8C needs one column)</td></tr></table>
    <p>If the superclass has a multivalued attribute, step 6 follows. With 8B, that extra table is created once per subclass.</p>
    <p><b>Reading the diagram:</b> the letter in the circle is <b>d</b> (disjoint) or <b>o</b> (overlapping). A <b>double line</b> from the superclass to the circle means total; a single line means partial.</p>` },
  { h: 'Answer recipe for schema design questions', html: `
    <ol><li>List every regular entity and write its table (step 1). Split composites, skip multivalued and derived.</li>
    <li>Do weak entities (step 2): borrow the owner's key.</li>
    <li>Go through every diamond once. Read its ratio: N:M → new table; 1:N → FK on the N side; 1:1 → FK on the total side. Do not forget relationship attributes.</li>
    <li>Make a table for every double-oval attribute (step 6).</li>
    <li>Diamonds with three or more lines get their own table (step 7).</li>
    <li>For each circle (d/o), choose 8A-8D and say why it is applicable.</li>
    <li>Underline all primary keys. Draw every foreign key arrow. Recount: each diamond and each double oval must be accounted for.</li></ol>` } ] },

{ id: 'sto', n: 3, title: 'Storage Architecture', src: 'Storage Structure slides',
  big: `Databases exist to do <b>CRUD</b> (create, read, update, delete) efficiently on huge data, for many requests at once. What the storage devices can do decides what the DBMS can do fast. So: know the memory hierarchy, how disks store blocks, how records sit in blocks, and how the three file organizations trade search speed against insert speed.`,
  concepts: [
  { h: 'Memory hierarchy', html: `
    <table class="t"><tr><th>Level</th><th>Devices</th><th>Properties</th><th>Role in a DBMS</th></tr>
    <tr><td><b>Primary</b></td><td>CPU registers, cache, main memory (RAM)</td><td>Fastest, smallest, costliest. <b>Volatile</b>: loses data without power</td><td>Buffers a fraction of the data</td></tr>
    <tr><td><b>Secondary</b></td><td>SSD, magnetic disk</td><td>Slower, larger, cheaper. <b>Persistent</b></td><td>Main home of the database</td></tr>
    <tr><td><b>Tertiary</b></td><td>Magnetic tape, optical drives</td><td>Slowest, largest, cheapest</td><td>Backup; often offline</td></tr></table>
    <p>The CPU is always several times faster than the fastest memory. Registers and caches are managed by hardware, so <b>efficient use of main memory and secondary storage</b> is the DBMS's main performance concern.</p>
    <table class="t"><tr><th></th><th>Disk database</th><th>In-memory database</th></tr>
    <tr><td>Where the data lives</td><td>Secondary storage; only a part is buffered in RAM</td><td>Whole database is read into a RAM buffer at start-up</td></tr>
    <tr><td>CRUD</td><td>Through the buffer, with disk reads and writes</td><td>All on RAM content</td></tr>
    <tr><td>Disk is used for</td><td>The data itself (tertiary for backup)</td><td>Backup: data kept as log entries, synced periodically to survive power failure or app closure</td></tr>
    <tr><td>Used when</td><td>Data is too large for RAM (most systems)</td><td>Small data: smartphone and smart-device apps</td></tr></table>` },
  { h: 'Secondary storage, blocks, RAID, networks', html: `
    <ul><li><b>Magnetic disks</b> are still the usual choice. <b>SSDs</b> are used too but have not replaced them: smaller capacity, shorter lifespan.</li>
    <li>Both are <b>block storage devices</b>: to make up for their slowness, a whole <b>block</b> of consecutive locations is read or written at a time. OS files use one or more blocks. DBMSs tune block size and organization; high-end systems even modify the OS for this.</li>
    <li><b>Object storage</b>: files store whole objects (and files still use blocks underneath). Systems built on it (in-memory and object databases) do not optimize block access and often do not know which file holds what.</li>
    <li><b>RAID</b> (Redundant Array of Inexpensive Disks): several independent disks act as one logical disk and are read/written in parallel, giving more transfer bandwidth. Splitting data over disks is <b>striping</b> (bit-level or block-level). Extra disks holding a backup copy or error-correcting data add safety.</li>
    <li><b>NAS</b> (network-attached storage): servers that only provide storage for file sharing; space can be added without shutting servers down.</li>
    <li><b>SAN</b> (storage area network): storage peripherals are nodes on a high-speed network (Fibre Channel point-to-point, switches, hubs), attached to and detached from servers flexibly. With NAS/SAN, network speed and bandwidth also matter.</li></ul>` },
  { h: 'Buffering', html: `
    <p>Only a small fraction of the disk data can be in RAM. Holding it there is <b>buffering</b>; the component that decides what to hold, how, and how long is the <b>buffer manager</b>. It sees memory as a <b>buffer pool</b> of <b>pages</b>; the pool size is a DBMS parameter set by the DBA.</p>
    <table class="t"><tr><th>Two goals</th><th>Two kinds of buffer manager</th></tr>
    <tr><td>1. Maximize the probability that a requested page is already in main memory.<br>2. When a new block must be read, replace the page that causes the least harm (not needed again soon).</td><td>1. Controls main memory directly (most RDBMSs).<br>2. Allocates buffers in virtual memory, so the OS decides what is really in RAM (main-memory and some object-oriented DBMSs).</td></tr></table>
    <p><b>Physical database design</b> = choosing and combining these technologies for maintenance, backup, disaster recovery, security and, above all, performance.</p>` },
  { h: 'Files, records and blocking', html: `
    <ul><li><b>Primary data</b> = the tuples. <b>Secondary data</b> = metadata: indexes, catalogs, logs. They are never mixed; separate files.</li>
    <li>Usually one or more files per relation. A <b>mixed data file</b> (several relations in one file) is rare: used when the relations are often accessed together, or have very few tuples.</li>
    <li>A tuple is stored as a <b>record</b>; its attributes are <b>fields</b>. Large fields: <b>BLOB</b> (images), <b>CLOB</b> (large text).</li>
    <li><b>Fixed-length records</b>: all fields have fixed (or small maximum) length. Best performance. <b>Variable-length records</b>: some fields vary greatly; need separator characters or pointers. Some systems split a tuple into a fixed part and a variable part in separate files, with pointers.</li></ul>
    <p class="formula"><b>Blocking factor</b> &nbsp; bfr = ⌊B / R⌋ records per block &nbsp;&nbsp; (B = block size, R = record size, B ≥ R)<br><b>Unused space per block</b> = B − (bfr × R) bytes</p>
    <p>Example: B = 512, R = 71 → bfr = ⌊7.21⌋ = 7, unused = 512 − 497 = 15 bytes.</p>
    <table class="t"><tr><th>Unspanned</th><th>Spanned</th></tr><tr><td>Records may not cross block boundaries. The leftover space is wasted.</td><td>A record may start in one block and continue in another; a pointer at the end of the first block points to the rest. <b>Required when a record is larger than a block.</b></td></tr></table>` },
  { h: 'File organizations', html: `
    <table class="t"><tr><th></th><th>Heap (unordered)</th><th>Sorted (ordered / sequential)</th><th>Hash</th></tr>
    <tr><td><b>Idea</b></td><td>Records in insertion order</td><td>Records physically ordered by an <b>ordering field</b> (an <b>ordering key</b> if unique)</td><td>Hash function h on the <b>hash field</b> gives the bucket</td></tr>
    <tr><td><b>Insert</b></td><td>Very efficient: append to the last block</td><td>Expensive: about half the records move. Fix: <b>overflow (transaction) file</b>, merged into the <b>master file</b> at reorganization</td><td>Fast: compute h, write to the bucket</td></tr>
    <tr><td><b>Search</b></td><td>Linear, block by block: expensive</td><td>Binary search on the ordering key; range queries and "next record" are cheap</td><td>Very fast for <b>equality</b> on the hash field, usually one block access. No range search</td></tr>
    <tr><td><b>Delete</b></td><td>Leaves unused space, or use a <b>deletion marker</b>; periodic reorganization</td><td>Deletion markers + periodic reorganization</td><td>Remove from the bucket / chain</td></tr>
    <tr><td><b>Used when</b></td><td>With indexes that point to the records</td><td>Many ordered or range reads on one field</td><td>Lookups by exact key</td></tr></table>
    <p><b>Hashing details.</b> A good hash function spreads records uniformly (few <b>collisions</b>) while keeping buckets full. <b>Internal hashing</b>: an in-memory array, used in query processing; collisions resolved by chaining. <b>External hashing</b>: for disk files; the address space is <b>buckets</b> (one block or a cluster of contiguous blocks, each holding several records); h gives a relative bucket number and a table in the file header maps it to a block address. A full bucket overflows into a linked list of <b>overflow records</b> (record pointers = block address + position). For files that grow and shrink: <b>extendible, dynamic and linear hashing</b>.</p>
    <p>DB-specific file operations built on the OS's open/close/read/write: <b>Scan, Find, FindNext, Insert, Delete</b>. The best organization depends on how the application uses the data.</p>` } ] },

{ id: 'nor', n: 4, title: 'Normalization', src: 'Lecture 6 · Chapter 10 · Lecture 7 practice',
  big: `<b>Normalization</b> decomposes an inefficient table into smaller tables to minimize <b>data redundancy</b> and avoid <b>update anomalies</b>. You check three normal forms in order, 1NF → 2NF → 3NF, using the primary key and the functional dependencies, and you write the complete current schema after each step.`,
  concepts: [
  { h: 'Why: redundancy and the three anomalies', html: `
    <p>EMP_PROJ(<u>SSN</u>, <u>Pnumber</u>, Hours, Ename, Pname, Plocation) repeats the employee's name for every project and the project's details for every employee.</p>
    <table class="t"><tr><th>Anomaly</th><th>Definition</th><th>Example in EMP_PROJ</th></tr>
    <tr><td><b>Insertion</b></td><td>Some data cannot be inserted at all, though the business rules allow it</td><td>A new employee cannot be inserted until a project is assigned (Pnumber is part of the key)</td></tr>
    <tr><td><b>Deletion</b></td><td>Some data is unintentionally lost when other data is deleted</td><td>Deleting project 3 also deletes Narayan, who works only on it</td></tr>
    <tr><td><b>Modification</b></td><td>The same data is stored in many rows; an incorrect update makes it inconsistent</td><td>Changing ProductX's location in one row only: other rows still say Bellaire</td></tr></table>` },
  { h: 'Functional dependencies', html: `
    <p><b>X → Y</b> ("X functionally determines Y"): whenever two rows have the same value for X, they must have the same value for Y. If all X values are unique, X → Y always holds.</p>
    <ul><li>FDs come from the <b>meaning</b> of the attributes (real-world constraints), not from a sample of rows.</li>
    <li>The primary key functionally determines all other attributes.</li>
    <li><b>Prime attribute</b>: part of the primary key. <b>Non-prime attribute</b>: not part of it.</li>
    <li>Examples: ID → {Name, CGPA}; {ID, CCode} → Grade.</li></ul>
    <table class="t"><tr><th>Kind of dependency</th><th>Shape</th><th>Breaks</th></tr>
    <tr><td><b>Full</b></td><td>A non-prime attribute depends on the whole primary key</td><td>nothing</td></tr>
    <tr><td><b>Partial</b></td><td>A non-prime attribute depends on only a <i>part</i> of a composite primary key</td><td>2NF</td></tr>
    <tr><td><b>Transitive</b></td><td>X → Y and Y → Z, with X the key and Y non-prime: a non-prime attribute depends on another non-prime attribute</td><td>3NF</td></tr></table>` },
  { h: 'The normal forms', html: `
    <table class="t"><tr><th>Form</th><th>Condition</th><th>How to fix a violation</th></tr>
    <tr><td><b>1NF</b></td><td>No composite attributes, no multivalued attributes, no nested relations: every value is atomic. (Considered part of the definition of a relation.)</td><td>Move the multivalued attribute to a new table together with the primary key</td></tr>
    <tr><td><b>2NF</b></td><td>In 1NF, and no partial dependency on the primary key: every non-prime attribute is fully dependent on the key</td><td>For each part of the key that determines something: new table (that part + what it determines). The rest stays with the full key</td></tr>
    <tr><td><b>3NF</b></td><td>In 2NF, and no transitive dependency: no non-prime attribute depends on another non-prime attribute</td><td>New table (determinant + what it determines). The determinant stays in the old table as a foreign key</td></tr></table>
    <p>The full list is 1NF, 2NF, 3NF, BCNF, 4NF, 5NF. In practice schemas are normalized up to 3NF (sometimes BCNF): higher forms mean more tables, more joins and slower queries, so over-normalization is avoided.</p>
    <p><b>Lecture examples.</b><br>1NF: Department(DName, <u>Dnumber</u>, DmgrID, DLocations{…}) → Department(DName, <u>Dnumber</u>, DmgrID) + Dept_Loc(<u>Dnumber</u>, <u>DLocation</u>).<br>
    2NF: Emp_Proj(<u>EID</u>, <u>Pno</u>, Hours, Ename, Pname, Plocation) with EID → Ename and Pno → Pname, Plocation → Employee(<u>EID</u>, Ename), Project(<u>Pno</u>, Pname, Plocation), Emp_Proj(<u>EID</u>, <u>Pno</u>, Hours).<br>
    3NF: Emp_Dept(<u>EID</u>, Ename, DOB, Address, Dno, Dname, DMgr) with Dno → Dname, DMgr → Employee(<u>EID</u>, Ename, DOB, Address, Dno), Department(<u>Dno</u>, Dname, DMgr).</p>` },
  { h: 'Answer recipe for normalization questions', html: `
    <ol><li><b>1NF?</b> Look for multivalued, composite or nested attributes. If none: "It is in 1NF because there are no multivalued/composite attributes and no nested relations."</li>
    <li><b>2NF?</b> Look at each FD. Is its left side a <i>proper part</i> of the primary key? Then it is a partial dependency. Name the FDs, then decompose.</li>
    <li><b>3NF?</b> Look at each remaining FD. Is its left side a <i>non-prime</i> attribute? Then it is a transitive dependency. Name the FD and the table it sits in, then decompose.</li>
    <li>After every step, write the <b>complete current schema</b> (all tables, keys underlined), not only the new tables.</li></ol>
    <ul><li>If the primary key is a single attribute, no partial dependency is possible: 1NF already implies 2NF.</li>
    <li>If no FD is given for an attribute, assume it depends on the whole primary key.</li>
    <li>If an attribute is not marked composite/multivalued, treat it as simple.</li></ul>` } ] }
],

traps: [

['con','Saying a duplicate primary key value violates entity integrity.','Duplicate → key constraint. NULL in a primary key → entity integrity.'],

['con','Forgetting that one operation can violate two constraints.','Insert <\'D1\', \'Stafford\'> breaks domain (not an integer) and referential (no such department). Name both.'],
['con','Allowing NULL for any foreign key.','NULL is allowed only when the foreign key is not part of the primary key of its own table.'],
['con','Stopping after naming the constraint.','The question also asks how to enforce it: give the declaration (data type, PRIMARY KEY, FOREIGN KEY, ON DELETE/UPDATE).'],
['map','Putting the foreign key on the 1 side of a 1:N relationship.','It goes on the N side. The 1 side would need many values in one cell.'],
['map','Making a separate table for a 1:N relationship.','Possible, but the foreign key approach is expected; a separate table is only required for N:M and n-ary.'],
['map','Forgetting relationship attributes.','N:M and n-ary: in the relationship table. 1:N: on the N side. 1:1: with the foreign key.'],
['map','Keeping a multivalued attribute as a column, or storing a derived attribute.','Multivalued → its own table (step 6). Derived → not in the schema.'],
['map','Giving a weak entity only its partial key as primary key.','PK = owner\'s primary key + partial key, and the owner\'s key is also a foreign key.'],

['sto','Saying SSDs have replaced magnetic disks for databases.','Not yet: smaller capacity and shorter lifespan. Magnetic disks are still the usual choice.'],
['sto','Rounding the blocking factor up.','bfr is the floor: ⌊B / R⌋. A partly fitting record does not count (unspanned).'],

hooks: [
['The four constraints: "D-K-E-R"', 'Check in this order: <b>D</b>omain (is the value legal?), <b>K</b>ey (is it unique?), <b>E</b>ntity (is the key non-NULL?), <b>R</b>eferential (does what it points to exist?). Think of an ID card desk: right format, not already issued, not blank, and the department on it must exist.'],
['Delete has one enemy', 'A delete can only hurt someone who is <i>pointing at</i> the deleted row. So for deletes, look only for foreign keys that reference it.'],
['RESTRICT, CASCADE, SET NULL', 'The parent wants to leave. <b>Restrict</b>: "you cannot leave while you have children." <b>Cascade</b>: "the children leave with you." <b>Set null</b>: "the children stay, with no parent recorded."'],
['Where does the foreign key go?', '<b>"Many carries the key."</b> In 1:N the N side holds the foreign key. In N:M both are "many", so neither can carry it: build a new table. In 1:1 the side that <i>must</i> participate (double line) carries it.'],
['8A-8D in four words', '<b>A</b>ll tables · <b>B</b>ottom only (subclasses) · <b>C</b>ategory column · <b>D</b>ouble flags. B needs total. C needs disjoint. A and D never fail.'],
['Memory pyramid', 'Top to bottom: registers → cache → RAM → SSD/disk → tape. Going down: <b>slower, cheaper, larger</b>. The first three forget everything at power-off.'],
['Heap, sorted, hash', '<b>Heap</b> = a pile of papers: drop a new one on top (fast), search the whole pile (slow). <b>Sorted</b> = a dictionary: quick to look up, painful to add a word in the middle. <b>Hash</b> = numbered lockers: the key tells you the locker, but you cannot ask for "all lockers between A and M".'],
['The key, the whole key, nothing but the key', '<b>1NF</b>: there is a key and values are atomic. <b>2NF</b>: non-prime attributes depend on the <b>whole</b> key (no partial). <b>3NF</b>: and on <b>nothing but</b> the key (no transitive).'],
['Spot the violation from the left side of the FD', 'Left side = <b>part of the key</b> → partial → 2NF problem. Left side = <b>non-prime</b> → transitive → 3NF problem. Left side = whole key → fine.']
],

practice: [
{ topic: 'con', kind: 'sheet', title: 'Chapter 5 practice sheet: constraint violations (a–g)', img: 'company',
  q: `Consider the relational database state shown (primary keys underlined, foreign keys shown with arrows). Each update operation below is applied directly to that state. Discuss which integrity constraint(s) are violated by each operation and how you can enforce these constraints so that no violation occurs. If an operation violates nothing, briefly explain why.
  <ol type="a"><li>Insert &lt;'D1', 'Stafford'&gt; into Department_Locations</li><li>Insert &lt;6, 'Stafford'&gt; into Department_Locations</li><li>Insert &lt;null, 'Stafford'&gt; into Department_Locations</li><li>Update Dno of John B Smith to 3 in Employee</li><li>Delete the employee Franklin T Wong from Employee</li><li>Delete the third record from Works_On</li><li>Update Pnumber of ProductX to 20 in Project</li></ol>`,
  a: `<table class="t"><tr><th></th><th>Violated</th><th>Why</th><th>How to prevent</th></tr>
  <tr><td>a</td><td><b>Domain</b> and <b>referential</b></td><td>Dnumber is an integer and 'D1' is not. Also there is no 'D1' in the referenced table Department.</td><td>Declare Dnumber as INT; declare Dnumber in Dept_Locations as a FOREIGN KEY to Department.</td></tr>
  <tr><td>b</td><td><b>Referential</b></td><td>There is no department 6 in Department (only 1, 4, 5).</td><td>Declare Dnumber as a FOREIGN KEY to Department.</td></tr>
  <tr><td>c</td><td><b>Entity integrity</b></td><td>Dnumber is part of the primary key (Dnumber, Dlocation), so it cannot be NULL.</td><td>Declare (Dnumber, Dlocation) as PRIMARY KEY.</td></tr>
  <tr><td>d</td><td><b>Referential</b></td><td>There is no department 3 in Department.</td><td>Declare Dno in Employee as a FOREIGN KEY to Department.</td></tr>
  <tr><td>e</td><td><b>Referential</b></td><td>Wong's SSN 333445555 is referenced by Department(Mgr_ssn), Works_On(Essn) and Dependent(Essn) (and by Employee.Super_ssn of other employees). After the delete those values would point to nothing.</td><td>On each foreign key say what happens ON DELETE: RESTRICT (deletion not allowed), CASCADE (referencing rows deleted too) or SET NULL (the referencing column becomes NULL).</td></tr>
  <tr><td>f</td><td><b>None</b></td><td>Works_On is not referenced by any other table, and deleting a row cannot break domain, key or entity constraints.</td><td>Nothing needed.</td></tr>
  <tr><td>g</td><td><b>Key</b> and <b>referential</b></td><td>Pnumber is the primary key of Project and 20 already exists (Reorganization). Also ProductX's Pnumber 1 is referenced in Works_On; after the change those rows would point to nothing.</td><td>Declare Pnumber as PRIMARY KEY. On the foreign key Works_On.Pno say what happens ON UPDATE: RESTRICT, CASCADE or SET NULL.</td></tr></table>
  <p class="mini">Note on (e): SET NULL cannot be used for Works_On.Essn or Dependent.Essn, because Essn is part of their primary keys.</p>` },
{ topic: 'con', kind: 'own', title: 'Extra: keys and constraints, short questions',
  q: `<ol><li>R(A, B, C) has the rows (1, x, p), (2, x, q), (3, y, p). Which single attributes can be a key in this state? Is {A, B} a key?</li><li>Grades(<u>SID</u>, <u>CCode</u>, Grade). Can SID be NULL? Can Grade be NULL?</li><li>Can a foreign key refer to the same table it is in? Give an example.</li><li>Which constraints can an UPDATE of a non-key, non-foreign-key column violate?</li></ol>`,
  a: `<ol><li>Only A has unique values, so A can be a key. {A, B} is unique, so it is a superkey, but not a key: it is not minimal, because A alone is already unique.</li><li>SID cannot be NULL: it is part of the primary key (entity integrity). Grade can be NULL unless it is declared NOT NULL.</li><li>Yes. Employee(<u>SSN</u>, …, Super_ssn) where Super_ssn refers to Employee.SSN, or Course(<u>Code</u>, …, prereq_Code).</li><li>Only the domain constraint (a wrong type, format or range, or NULL where NOT NULL is declared).</li></ol>` },
{ topic: 'map', kind: 'sheet', title: 'Chapter 7 Q1: Players and Teams', img: 'q1',
  q: `Construct a relational schema from the ER diagram.`,
  a: `<p class="sch">PLAYERS(<u>Phone</u>, Name, Position, Skill_Level, Team_Name)<br>PLAYERS_INJURYRECORDS(<u>Phone</u>, <u>InjuryRecords</u>)<br>TEAMS(<u>Name</u>, City, Coach, Captain_Phone)<br>PLAYS_WITH(<u>Host_Team</u>, <u>Guest_Team</u>, Date, Score)</p>
  <p><b>Foreign keys:</b> PLAYERS.Team_Name → TEAMS.Name · PLAYERS_INJURYRECORDS.Phone → PLAYERS.Phone · TEAMS.Captain_Phone → PLAYERS.Phone · PLAYS_WITH.Host_Team and Guest_Team → TEAMS.Name</p>
  <ul><li>belong_to is N:1 (many players, one team): foreign key Team_Name on the N side, PLAYERS.</li><li>captain_of is 1:1 and every team must have a captain (total on TEAMS): foreign key Captain_Phone in TEAMS.</li><li>plays_with is a recursive N:M on TEAMS: new table with the key twice, under the role names Host and Guest, plus Date and Score.</li><li>injuryRecords is multivalued: its own table (step 6).</li></ul>` },
{ topic: 'map', kind: 'sheet', title: 'Chapter 7 Q2: Books, Publisher, Cart, Warehouse', img: 'q2',
  q: `Construct a relational schema from the ER diagram.`,
  a: `<p class="sch">Books(<u>ISBN</u>, Title, Year, Price, Publisher_Name, Warehouse_City, Warehouse_SerialNo)<br>Books_Author(<u>ISBN</u>, <u>Author</u>)<br>Publisher(<u>Name</u>, Email, Address, Website, Phone)<br>Shopping_Cart(<u>Cart_ID</u>)<br>Added_To(<u>ISBN</u>, <u>Cart_ID</u>, Quantity, Date)<br>Customer(<u>User_ID</u>, Name, Phone, Email, Street, Country, Zip, City, Cart_ID)<br>Warehouse(<u>City</u>, <u>SerialNo</u>, Manager, Address, Phone)</p>
  <p><b>Foreign keys:</b> Books.Publisher_Name → Publisher.Name · Books.(Warehouse_City, Warehouse_SerialNo) → Warehouse.(City, SerialNo) · Books_Author.ISBN → Books · Added_To.ISBN → Books, Added_To.Cart_ID → Shopping_Cart · Customer.Cart_ID → Shopping_Cart</p>
  <ul><li>published_by and Stored_In are N:1 from Books: both foreign keys go into Books (the N side). Warehouse's key ID is composite (City, Serial_No), so two columns are needed.</li><li>author is multivalued: Books_Author.</li><li>Added_To is N:M with attributes quantity and Date: its own table.</li><li>Has is 1:1 between Customer and Shopping_Cart: foreign key approach, Cart_ID in Customer.</li><li>Publisher has two keys (Name, website); one is chosen as primary key. Customer's composite address is replaced by street, city, zip, country.</li></ul>` },
{ topic: 'map', kind: 'sheet', title: 'Chapter 7 Q3: Pet shop', img: 'q3',
  q: `Construct a relational schema from the ER diagram.`,
  a: `<p class="sch">Pet(<u>TagNo</u>, description, price, Name, type, cost, Nid, PDate, PTime, Phone, SDate, STime)<br>Vet(<u>Phone</u>, fees, address, name)<br>Visits(<u>TagNo</u>, <u>Phone</u>, Date, reason, time)<br>Visit_medicine(<u>TagNo</u>, <u>Phone</u>, <u>med_name</u>, dose)<br>Supplier(<u>Phone</u>, zip, city, street, country, Name)<br>Customer(<u>Nid</u>, address, name, contact, email, rNid, points)</p>
  <p><b>Foreign keys:</b> Pet.Nid → Customer.Nid (purchased_by, with PDate, PTime) · Pet.Phone → Supplier.Phone (supplied_by, with SDate, STime) · Visits.TagNo → Pet, Visits.Phone → Vet · Visit_medicine.(TagNo, Phone) → Visits · Customer.rNid → Customer.Nid (referred, with points)</p>
  <ul><li>profit is derived (dashed oval): not stored.</li><li>supplied_by and purchased_by are N:1 from Pet: both foreign keys and their Date/Time attributes go into Pet.</li><li>visits is N:M between Pet and Vet: its own table.</li><li>medicines is a multivalued composite attribute of visits (med_name is its partial key): a table keyed by the visit's key plus med_name.</li><li>referred is a recursive 1:N on Customer: one extra column rNid (the referrer) plus points.</li><li>Supplier's composite location is replaced by zip, city, street, country.</li></ul>` },

  a: `<p class="sch">BUILDINGS(<u>BNumber</u>, Address, Mgr_Name, Mgr_Phone)<br>ROOMS(<u>BNumber</u>, <u>FloorNo</u>, <u>SerialNo</u>, Type, Capacity)<br>EXAM_OF(<u>BNumber</u>, <u>FloorNo</u>, <u>SerialNo</u>, <u>CCode</u>, Etype, Date, Time)<br>COURSES(<u>CCode</u>, Name, Credits, Department)</p>

{ topic: 'map', kind: 'sheet', title: 'Chapter 7 Q5: Services, Customers, Employees (EER)', img: 'q5',
  q: `Construct a relational schema from the EER diagram. For each of the subclasses/superclasses use any suitable option out of the four.`,
  a: `<p class="sch">SERVICES(<u>ID</u>, Price, Start_time, Start_Date, Duration, Type)<br>PURCHASE(<u>ID</u>, <u>NID</u>)<br>CUSTOMER(Name, Phone, <u>NID</u>, email, Skills, Strength, Weakness, CA_ID)<br>EMPLOYEE(<u>Emp_ID</u>, Name, email, Phone)<br>CAREER_ADVISOR(<u>Emp_ID</u>)<br>CLIENT_MANAGER(<u>Emp_ID</u>)<br>ASSIGNED(<u>IE_NID</u>, <u>NID</u>, <u>Emp_ID</u>)<br>INDUSTRY_EXPERT(Name, email, Phone, <u>NID</u>, Expertise)</p>
  <p><b>Foreign keys:</b> PURCHASE.ID → SERVICES, PURCHASE.NID → CUSTOMER · CUSTOMER.CA_ID → CAREER_ADVISOR.Emp_ID (Talks_to) · CAREER_ADVISOR.Emp_ID and CLIENT_MANAGER.Emp_ID → EMPLOYEE · ASSIGNED.IE_NID → INDUSTRY_EXPERT, ASSIGNED.NID → CUSTOMER, ASSIGNED.Emp_ID → CLIENT_MANAGER</p>
  <ul><li>Services → Resume / Interview / Mentorship is disjoint and the subclasses have no attributes of their own: <b>8C</b>, one table with a Type column.</li><li>Employee → Career_Advisor / Client_Manager: <b>8A</b>, because each subclass takes part in its own relationship, so each needs its own table to be referenced.</li><li>Purchase is N:M: its own table. Talks_to is N:1 from Customer to Career_Advisor: foreign key CA_ID in Customer.</li><li>assigned is a ternary relationship (Customer, Client_Manager, Industry_Expert): its own table with all three keys.</li></ul>
  <p class="mini">The sheet notes that some questions have more than one correct solution; other applicable options for the specializations are also acceptable if you justify them.</p>` },
{ topic: 'map', kind: 'sheet', title: 'Chapter 7 Q6: which of 8A–8D are not applicable?', img: 'q6',
  q: `There are four options for mapping subclasses and superclasses: 8A separate tables for each subclass and superclass; 8B tables for only subclasses; 8C one table with one type attribute; 8D one table with many type/flag attributes. State which options are <b>not</b> applicable for each diagram and explain why. If all four are applicable, state "all options are applicable".<br>A: disjoint, total (double line) · B: disjoint, partial · C: overlapping, partial · D: overlapping, total.`,
  a: `<table class="t"><tr><th></th><th>Diagram</th><th>Answer</th><th>Reason</th></tr>
  <tr><td>A</td><td>d, total</td><td>All options are applicable</td><td></td></tr>
  <tr><td>B</td><td>d, partial</td><td>8B not applicable</td><td>8B has tables only for subclasses. With partial specialization, a superclass entity that belongs to no subclass would have nowhere to be stored: its data is lost.</td></tr>
  <tr><td>C</td><td>o, partial</td><td>8B and 8C not applicable</td><td>8B: same reason (partial). 8C: with overlapping, one type attribute cannot store the complete information when an entity belongs to several subclasses.</td></tr>
  <tr><td>D</td><td>o, total</td><td>8C not applicable</td><td>Overlapping: same reason as above.</td></tr></table>` },
{ topic: 'sto', kind: 'own', title: 'Storage: short theory questions (no faculty sheet; written from the slides)',
  q: `<ol><li>Why is storage a central concern in database system design?</li><li>Differentiate primary, secondary and tertiary storage, with the role of each in a DBMS.</li><li>How does an in-memory database avoid losing data on power failure?</li><li>Why are magnetic disks and SSDs called block storage devices?</li><li>What is RAID? What is striping?</li><li>State the two goals of the buffer manager.</li><li>Differentiate primary data and secondary data. What is a mixed data file and when is it used?</li><li>A file has fixed-length records of 120 bytes and the block size is 1024 bytes. Find the blocking factor and the unused space per block (unspanned). How many blocks are needed for 2,000 records?</li><li>When must a spanned organization be used?</li><li>Compare heap, sorted and hash files for insertion and for searching.</li><li>Why is insertion expensive in a sorted file, and how does an overflow file help?</li><li>Differentiate internal and external hashing. Name three hashing techniques that support dynamic expansion.</li></ol>`,
  a: `<ol><li>Databases must do CRUD efficiently on huge volumes of data and for hundreds to thousands of requests per second. What storage devices can do limits what the DBMS can implement efficiently, so storage shapes its design and configuration.</li>
  <li>Primary (registers, cache, RAM): fastest, volatile; holds the buffered part of the data. Secondary (SSD, magnetic disk): persistent, larger, slower; the main location of the database. Tertiary (tape, optical): mainly for backup, often offline.</li>
  <li>It stores data on disk as log entries and periodically syncs the RAM version with the disk files; at start-up the whole database is read from disk into a RAM buffer.</li>
  <li>To compensate for being slow compared with main memory, they read and write a whole block of data from/to consecutive locations at a time.</li>
  <li>Redundant Array of Inexpensive Disks: several independent disks connected so that read/write requests run on them in parallel; together they act as a single logical disk with better transfer bandwidth. Striping is dividing the data across the disks (bit-level or block-level). RAID can also keep a backup disk or error-correcting data.</li>
  <li>(1) Maximize the probability that a requested page is found in main memory. (2) When a new block must be read, replace the page that will cause the least harm, i.e. one not required again shortly.</li>
  <li>Primary data: the tuples of the relations. Secondary data: metadata such as indexes, catalogs, logs. They are kept in separate files. A mixed data file holds tuples of several relations in one primary file; used when the relations are frequently accessed together or have too few tuples for separate files.</li>
  <li>bfr = ⌊1024 / 120⌋ = ⌊8.53⌋ = <b>8</b> records per block. Unused = 1024 − 8 × 120 = <b>64 bytes</b>. Blocks = ⌈2000 / 8⌉ = <b>250</b>.</li>
  <li>Whenever a record is larger than a block. (It can also be chosen to use the leftover space in each block.)</li>
  <li>Heap: insert very efficient (append at end); search is linear, block by block. Sorted: search by binary search on the ordering key, range and next-record access efficient; insert expensive. Hash: very fast equality search on the hash field (usually one block access) and fast insert; no range search.</li>
  <li>Records must stay physically ordered, so on average half the records must be moved (half the blocks read and rewritten) to make space. With an overflow (transaction) file, new records are appended there and periodically sorted and merged with the master file; insertion becomes efficient, but searching becomes more complex.</li>
  <li>Internal hashing: within main memory, used for faster query processing (an array of positions, collisions resolved by chaining). External hashing: for disk files; the address space is buckets, each one block or a cluster of blocks holding several records. Dynamic expansion: extendible hashing, dynamic hashing, linear hashing.</li></ol>` },
{ topic: 'nor', kind: 'sheet', title: 'Lecture 6 example: Student (grades and projects)',
  q: `Student(<u>StID</u>, <u>CourseCode</u>, <u>Semester</u>, StudentName, AttemptedCredits, CourseTitle, Grade, ProjID, ProjectMarks, ProjectName)<br>FD1: StudentID → StudentName<br>FD2: CourseCode → CourseTitle<br>FD3: StudentID, Semester → AttemptedCredits<br>FD4: ProjID → ProjectName, ProjectMarks<br>Identify and explain which normal form the schema is in. Step by step normalize it until 3NF. Show the complete current schema after each step.`,
  a: `<p><b>It is in 1NF</b>: no multivalued/composite attributes and no nested tables. <b>Not in 2NF</b>: partial dependencies on the primary key exist due to FD1, FD2 and FD3.</p>
  <p class="sch"><b>2NF:</b><br>Student(<u>StID</u>, StudentName)<br>Course(<u>CourseCode</u>, CourseTitle)<br>Student_Credits(<u>StID</u>, <u>Semester</u>, AttemptedCredits)<br>Student_Grades(<u>StID</u>, <u>CourseCode</u>, <u>Semester</u>, Grade, ProjID, ProjectMarks, ProjectName)</p>
  <p><b>Not in 3NF</b>: transitive dependency due to FD4 in Student_Grades (ProjID is non-prime).</p>
  <p class="sch"><b>3NF:</b><br>Student(<u>StID</u>, StudentName)<br>Course(<u>CourseCode</u>, CourseTitle)<br>Student_Credits(<u>StID</u>, <u>Semester</u>, AttemptedCredits)<br>Student_Grades(<u>StID</u>, <u>CourseCode</u>, <u>Semester</u>, Grade, ProjID)<br>Student_Projects(<u>ProjID</u>, ProjectMarks, ProjectName)</p>` },
{ topic: 'nor', kind: 'sheet', title: 'Normalization practice Q1: Car_Sales',
  q: `Car_Sales(<u>CarID</u>, <u>SalesmanID</u>, CarModel, CarYear, CarPrice, CarCompany, SMName, Discount, CommissionPercentage, DateSold)<br>FD1: CarID → CarModel, CarYear, CarPrice, CarCompany<br>FD2: SalesmanID → SMName, CommissionPercentage<br>FD3: DateSold → Discount<br>(a) Is it in 1NF? If not, normalize to 1NF. (b) Is it in 2NF? If not, normalize. (c) Is it in 3NF? If not, normalize. Show the complete current schema after each step.`,
  a: `<p><b>(a) 1NF: yes.</b> No multivalued/composite attributes or nested relations.</p>
  <p><b>(b) 2NF: no.</b> Partial dependencies due to FD1 and FD2 (CarID and SalesmanID are each only part of the key).</p>
  <p class="sch">Cars(<u>CarID</u>, CarModel, CarYear, CarPrice, CarCompany)<br>Salesmen(<u>SalesmanID</u>, SMName, CommissionPercentage)<br>Car_Sales(<u>CarID</u>, <u>SalesmanID</u>, Discount, DateSold)</p>
  <p><b>(c) 3NF: no.</b> Transitive dependency due to FD3 in Car_Sales (DateSold is non-prime and determines Discount).</p>
  <p class="sch">Cars(<u>CarID</u>, CarModel, CarYear, CarPrice, CarCompany)<br>Salesmen(<u>SalesmanID</u>, SMName, CommissionPercentage)<br>Car_Sales(<u>CarID</u>, <u>SalesmanID</u>, DateSold)<br>Discount_Info(<u>DateSold</u>, Discount)</p>
  <p class="mini">The sheet writes the last table as Discount_Info(Discount, DateSold) without marking a key. Since DateSold → Discount, DateSold is its key.</p>` },
{ topic: 'nor', kind: 'sheet', title: 'Normalization practice Q2: Books with a single-attribute key',
  q: `Books(<u>ISBN</u>, AuthorName, BookTitle, Publisher, Price, Year, AuthorAffiliation, Type, Category)<br>AuthorName → AuthorAffiliation<br>Type → Category<br>Identify and explain which normal form the schema is in. Step by step normalize it until 3NF.`,
  a: `<p><b>It is in 2NF.</b> 2NF has two conditions: (1) be in 1NF, (2) no partial dependency on the primary key. It is in 1NF (no multivalued/composite attributes or nested relations), and there can be no partial dependency because the key ISBN is a single attribute.</p>
  <p><b>Not in 3NF</b>: both given FDs have a non-prime attribute on the left, so they are transitive dependencies.</p>
  <p class="sch"><b>3NF:</b><br>Books(<u>ISBN</u>, AuthorName, BookTitle, Publisher, Price, Year, Type)<br>Author(<u>AuthorName</u>, AuthorAffiliation)<br>BookType(<u>Type</u>, Category)</p>` },
{ topic: 'nor', kind: 'sheet', title: 'Normalization practice Q3: Books with a composite key',
  q: `Books(<u>AuthorName</u>, <u>BookTitle</u>, Publisher, Price, Year, AuthorAffiliation, Type, Category)<br>AuthorName → AuthorAffiliation<br>BookTitle → Publisher, Price, Year, Type, Category<br>Type → Category<br>Identify and explain which normal form the schema is in. Step by step normalize it until 3NF.`,
  a: `<p><b>It is in 1NF</b> (no multivalued/composite attributes or nested relations). <b>Not in 2NF</b>: the first two FDs are partial dependencies on the key. The third FD is a transitive dependency, so it is not in 3NF either.</p>
  <p class="sch"><b>2NF:</b><br>Author(<u>AuthorName</u>, AuthorAffiliation)<br>Book1(<u>BookTitle</u>, Publisher, Price, Year, Type, Category)<br>Book2(<u>AuthorName</u>, <u>BookTitle</u>)</p>
  <p class="sch"><b>3NF:</b><br>Author(<u>AuthorName</u>, AuthorAffiliation)<br>Book1(<u>BookTitle</u>, Publisher, Price, Year, Type)<br>BookType(<u>Type</u>, Category)<br>Book2(<u>AuthorName</u>, <u>BookTitle</u>)</p>
  <p class="mini">Book2 keeps only the key. It must stay: it records which author wrote which book.</p>` },
{ topic: 'nor', kind: 'sheet', title: 'Normalization practice Q4: Student_Project',
  q: `Student_Project(<u>StudentID</u>, <u>ProjectID</u>, SName, PName, CourseCode, CTitle, Semester, Score, CGPA)<br>FD1: StudentID → SName, CGPA<br>FD2: ProjectID → PName, CourseCode, CTitle, Semester<br>FD3: CourseCode → CTitle<br>(a) 1NF? (b) 2NF? (c) 3NF? Normalize where needed and show the complete current schema after each step.`,
  a: `<p><b>(a) 1NF: yes.</b> No multivalued/composite attributes or nested relations.</p>
  <p><b>(b) 2NF: no.</b> Partial dependencies due to FD1 and FD2.</p>
  <p class="sch">Students(<u>StudentID</u>, SName, CGPA)<br>Projects(<u>ProjectID</u>, PName, CourseCode, CTitle, Semester)<br>Student_Project(<u>StudentID</u>, <u>ProjectID</u>, Score)</p>
  <p><b>(c) 3NF: no.</b> Transitive dependency due to FD3 in the Projects table.</p>
  <p class="sch">Students(<u>StudentID</u>, SName, CGPA)<br>Projects(<u>ProjectID</u>, PName, CourseCode, Semester)<br>Courses(<u>CourseCode</u>, CTitle)<br>Student_Project(<u>StudentID</u>, <u>ProjectID</u>, Score)</p>` }
],

<script>
(function () {
const D = window.DATA, IMG = window.IMG || {};
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const TN = {}; D.topics.forEach((t) => { TN[t.id] = t; });
const TABS = [['overview', 'Big picture'], ['concepts', 'Concepts'], ['definitions', 'Definitions'], ['simulators', 'Simulators'], ['traps', 'Exam traps'], ['hooks', 'Memory hooks'], ['practice', 'Practice'], ['selftest', 'Self-test']];
let topic = 'all', cram = false;
const wrapTables = (h) => h.replace(/<table class="t">/g, '<div class="wrap"><table class="t">').replace(/<\/table>/g, '</table></div>');
const show = (t) => topic === 'all' || topic === t;

// ---------- shell ----------
$('#nav').innerHTML = TABS.map((t) => '<a href="#' + t[0] + '" data-tab="' + t[0] + '">' + t[1] + '</a>').join('');
$('#filter').innerHTML = '<button class="btn sm on" data-t="all">All topics</button>' + D.topics.map((t) => '<button class="btn sm" data-t="' + t.id + '">' + t.n + ' · ' + t.title + '</button>').join('');
$('#main').innerHTML = TABS.map((t) => '<section id="s-' + t[0] + '"></section>').join('');
function go() {
  let id = (location.hash || '#overview').slice(1); if (!TABS.some((t) => t[0] === id)) id = 'overview';
  if (cram && id !== 'definitions' && id !== 'selftest') id = 'definitions';
  $$('section').forEach((s) => s.classList.toggle('on', s.id === 's-' + id));
  $$('#nav a').forEach((a) => { a.classList.toggle('on', a.dataset.tab === id); a.style.display = cram && a.dataset.tab !== 'definitions' && a.dataset.tab !== 'selftest' ? 'none' : ''; });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', go);
$('#filter').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; topic = b.dataset.t; $$('#filter button').forEach((x) => x.classList.toggle('on', x === b)); renderAll(); });
$('#cram').addEventListener('click', () => { cram = !cram; $('#cram').classList.toggle('on', cram); go(); });
function setTheme(d) { document.documentElement.dataset.theme = d ? 'dark' : 'light'; $('#theme').textContent = d ? 'Light' : 'Dark'; store.set('c370-dark', d); }
$('#theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme !== 'dark'));
setTheme(store.get('c370-dark', false));

// ---------- static sections ----------
function renderOverview() {
  const vids = [['Database Constraints', 'https://claude.ai/artifact/SYxiHvLZsU9gDUUpCvjvoh'], ['ER/EER to Relational Schema', 'https://claude.ai/artifact/WwU9DeNGyngw2yCrfmHFij'], ['Storage Architecture', 'https://claude.ai/artifact/Gq9uhBf4kxvHj2jgHPBZdY'], ['Normalization', 'https://claude.ai/artifact/UAgqhKPKdTup412npdktrS']];
  $('#s-overview').innerHTML = '<h2>Big picture</h2><p class="lead">Quiz and mid syllabus: Database Constraints · ER/EER to Relational Schema · Storage Architecture · Normalization. Question pattern: schema design / normalization and short theory questions.</p>' +
    '<div class="card"><svg viewBox="0 0 760 250" style="width:100%;max-width:760px" role="img" aria-label="How the four topics connect">' +
    '<path class="l" d="M190 60H250M450 60H510M350 95V150"/><path class="l" d="M240 52l12 8-12 8M500 52l12 8-12 8M342 140l8 12 8-12"/>' +
    '<rect class="s e" x="10" y="25" width="180" height="70" rx="8"/><text x="100" y="56" text-anchor="middle" font-weight="700">ER / EER diagram</text><text x="100" y="76" text-anchor="middle">(Lectures 2–3)</text>' +
    '<rect class="s d" x="250" y="25" width="200" height="70" rx="8"/><text x="350" y="56" text-anchor="middle" font-weight="700">2 · Mapping</text><text x="350" y="76" text-anchor="middle">8 steps → tables</text>' +
    '<rect class="s e" x="510" y="25" width="240" height="70" rx="8"/><text x="630" y="56" text-anchor="middle" font-weight="700">4 · Normalization</text><text x="630" y="76" text-anchor="middle">1NF → 2NF → 3NF: better tables</text>' +
    '<rect class="s d" x="230" y="155" width="240" height="70" rx="8"/><text x="350" y="186" text-anchor="middle" font-weight="700">1 · Constraints</text><text x="350" y="206" text-anchor="middle">keys + 4 rules on every table</text>' +
    '<rect class="s" x="510" y="155" width="240" height="70" rx="8"/><text x="630" y="186" text-anchor="middle" font-weight="700">3 · Storage</text><text x="630" y="206" text-anchor="middle">how tables sit on disk</text>' +
    '<path class="l" d="M470 190H510" stroke-dasharray="5 5"/></svg>' +
    '<p class="note">Design the tables (mapping), protect them with rules (constraints), remove redundancy (normalization), then store them efficiently (storage).</p></div>' +
    D.topics.filter((t) => show(t.id)).map((t, i) => '<div class="card"><span class="tn">Topic ' + t.n + ' · ' + t.src + '</span><h4>' + t.title + '</h4><p>' + t.big + '</p><p class="mini">In the notes: ' + t.concepts.map((c) => c.h).join(' · ') + '</p><p class="mini">Video: <a href="' + vids[t.n - 1][1] + '">' + vids[t.n - 1][0] + '</a></p></div>').join('');
}
function renderConcepts() {
  $('#s-concepts').innerHTML = '<h2>Core concepts</h2><p class="lead">Everything from the slides, in exam form. Tap a heading to open or close it.</p>' +
    D.topics.filter((t) => show(t.id)).map((t) => '<h3><span class="tn">Topic ' + t.n + '</span><br>' + t.title + '</h3>' + t.concepts.map((c, i) => '<details class="c"' + (i === 0 ? ' open' : '') + '><summary>' + c.h + '</summary><div>' + wrapTables(c.html) + '</div></details>').join('')).join('');

  } else { rels = [base]; steps.push({ t: '2NF check', ok: true, why: P.pk.length === 1 ? 'It is in 2NF: the primary key is a single attribute, so no partial dependency is possible.' : 'It is in 2NF: no non-prime attribute depends on only part of the key.', rels: rels }); }
  const out = [], hits = [];
  rels.forEach((r) => {
    let attrs = r.attrs.slice(); const extra = [];
    P.fds.forEach((f) => { if (sub(f[0], attrs) && !f[0].some((a) => r.pk.indexOf(a) >= 0) && f[1].some((a) => attrs.indexOf(a) >= 0)) { const mv = f[1].filter((a) => attrs.indexOf(a) >= 0); extra.push({ name: nm(f[0], 'R_' + f[0].join('')), attrs: f[0].concat(mv), pk: f[0].slice() }); attrs = attrs.filter((a) => mv.indexOf(a) < 0); hits.push(fdStr(f) + ' in ' + r.name); } });
    out.push({ name: extra.length ? nm(r.pk, r.name) : r.name, attrs: attrs, pk: r.pk }); extra.forEach((x) => out.push(x));
  });
  steps.push(hits.length ? { t: '3NF check', ok: false, why: 'Not in 3NF: transitive dependency due to ' + hits.join('; ') + '. The left side is a non-prime attribute. It stays behind as a foreign key.', rels: out } : { t: '3NF check', ok: true, why: 'It is in 3NF: no non-prime attribute depends on another non-prime attribute.', rels: out });
  return steps;
}
function simNormal(root) {

    { label: 'Student (lecture example)', name: 'Student', attrs: ['StID', 'CourseCode', 'Semester', 'StudentName', 'AttemptedCredits', 'CourseTitle', 'Grade', 'ProjID', 'ProjectMarks', 'ProjectName'], pk: ['StID', 'CourseCode', 'Semester'], fds: [[['StID'], ['StudentName']], [['CourseCode'], ['CourseTitle']], [['StID', 'Semester'], ['AttemptedCredits']], [['ProjID'], ['ProjectName', 'ProjectMarks']]], names: { StID: 'Student', CourseCode: 'Course', 'StID,Semester': 'Student_Credits', 'StID,CourseCode,Semester': 'Student_Grades', ProjID: 'Student_Projects' } },

function simStorage(root) {
  root.innerHTML = '<div class="card"><h4>5 · Blocking factor calculator</h4><div class="row"><label>Block size B (bytes)</label><input type="number" id="bf-b" value="512" min="1"><label>Record size R (bytes)</label><input type="number" id="bf-r" value="71" min="1"><label>Records in file</label><input type="number" id="bf-n" value="1000" min="0"></div><div id="bf-out"></div><p class="note">What to notice: the blocking factor is always rounded down, and the striped part of the block is wasted in an unspanned file.</p></div>' +
    '<div class="card"><h4>6 · Heap, sorted or hash: count the checks</h4><div class="row"><label>Search for key</label><select id="fs-k"></select><button class="btn pri" id="fs-go">Search</button></div><div id="fs-out"></div><p class="note">What to notice: the heap checks records one by one, the sorted file halves the range each time, and the hash file goes straight to one bucket. Bucket 3 is full, so its last record sits in an overflow chain.</p></div>';
  const bf = () => {
    const B = Math.max(1, +$('#bf-b', root).value || 1), R = Math.max(1, +$('#bf-r', root).value || 1), n = Math.max(0, +$('#bf-n', root).value || 0), o = $('#bf-out', root);
    if (R > B) { o.innerHTML = '<div class="res bad">A record (' + R + ' bytes) is larger than a block (' + B + ' bytes). An unspanned organization is impossible: the file must be <b>spanned</b>.</div>'; return; }
    const k = Math.floor(B / R), un = B - k * R, cells = [];
    for (let i = 0; i < Math.min(k, 40); i++) cells.push('<i style="width:' + Math.max(6, 100 * R / B * 6) + 'px"></i>');
    o.innerHTML = '<p class="formula">bfr = ⌊B / R⌋ = ⌊' + B + ' / ' + R + '⌋ = ⌊' + (B / R).toFixed(2) + '⌋ = <b>' + k + '</b> records per block<br>Unused = B − bfr × R = ' + B + ' − ' + k + ' × ' + R + ' = <b>' + un + '</b> bytes per block<br>Blocks needed = ⌈' + n + ' / ' + k + '⌉ = <b>' + Math.ceil(n / k) + '</b></p><div class="blocks">' + cells.join('') + (un ? '<i class="free" style="width:' + Math.max(6, 100 * un / B * 6) + 'px"></i>' : '') + '</div>';
  };
  const heap = [42, 7, 19, 88, 3, 61, 25], sorted = heap.slice().sort((a, b) => a - b), M = 4, CAP = 2;
  $('#fs-k', root).innerHTML = sorted.map((k) => '<option>' + k + '</option>').join('') + '<option>50</option>';
  const fs = () => {
    const key = +$('#fs-k', root).value;
    const hi = heap.indexOf(key), hn = hi < 0 ? heap.length : hi + 1;
    let lo = 0, up = sorted.length - 1, seen = [], found = -1;
    while (lo <= up) { const mid = Math.floor((lo + up) / 2); seen.push(mid); if (sorted[mid] === key) { found = mid; break; } if (sorted[mid] < key) lo = mid + 1; else up = mid - 1; }
    const buckets = []; for (let i = 0; i < M; i++) buckets.push([]); heap.forEach((k) => buckets[k % M].push(k));
    const cls = (ok, chk) => ok ? 'hit' : chk ? 'chk' : '';
    $('#fs-out', root).innerHTML = '<p style="margin:10px 0 2px"><b>Heap file</b>: linear search, ' + hn + ' record check' + (hn > 1 ? 's' : '') + (hi < 0 ? ' (whole file, not found)' : '') + '</p><div class="cells">' + heap.map((k, i) => '<span class="' + cls(i === hi, i < hn) + '">' + k + '</span>').join('') + '</div>' +
      '<p style="margin:10px 0 2px"><b>Sorted file</b>: binary search, ' + seen.length + ' check' + (seen.length > 1 ? 's' : '') + (found < 0 ? ' (not found)' : '') + '</p><div class="cells">' + sorted.map((k, i) => '<span class="' + cls(i === found, seen.indexOf(i) >= 0) + '">' + k + '</span>').join('') + '</div>' +
      '<p style="margin:10px 0 2px"><b>Hash file</b>: h(K) = K mod ' + M + ' = ' + (key % M) + ' → bucket ' + (key % M) + ' only' + (buckets[key % M].indexOf(key) < 0 ? ' (not found)' : '') + '</p>' + buckets.map((b, i) => '<div class="bk"><b>Bucket ' + i + '</b>' + b.map((k, j) => '<span class="' + (j >= CAP ? 'ov ' : '') + (i === key % M ? (k === key ? 'hit' : 'chk') : '') + '">' + k + (j >= CAP ? ' (overflow)' : '') + '</span>').join('') + (b.length ? '' : '<span class="mini" style="border:0;background:none">empty</span>') + '</div>').join('');
  };
  root.addEventListener('input', (e) => { if (e.target.id.indexOf('bf-') === 0) bf(); });
  root.addEventListener('click', (e) => { if (e.target.id === 'fs-go') fs(); });
  root.addEventListener('change', (e) => { if (e.target.id === 'fs-k') fs(); });
  bf(); fs();
}

function renderTest() {

    answered = false;
  };
  const flash = () => {
    const b = $('#st-body', s);
    if (!cards.length) { b.innerHTML = '<div class="card">No cards for this topic.</div>'; return; }
    const d = cards[ci];
    b.innerHTML = '<div class="card flash" id="st-flash"><div>' + (back ? d[2] : '<b>' + d[1] + '</b>') + '<small>' + (back ? d[1] : 'Say the definition, then tap to check') + ' · card ' + (ci + 1) + ' of ' + cards.length + '</small></div></div><div class="row"><button class="btn sm" id="st-pc">Previous</button><button class="btn pri" id="st-nc">Next card</button><button class="btn sm" id="st-sh">Shuffle</button></div>';
  };
  const draw = () => { $('#st-quiz', s).classList.toggle('on', mode === 'quiz'); $('#st-cards', s).classList.toggle('on', mode === 'cards'); retryLabel(); if (mode === 'quiz') quiz(); else flash(); };
  s.onclick = (e) => {
    const o = e.target.closest('.opt'), id = e.target.id;
    if (o && !answered) {
      answered = true; const qi = list[pos], q = D.quiz[qi], pick = +o.dataset.o, ok = pick === q[3];
      $$('.opt', s).forEach((x, i) => { if (i === q[3]) x.classList.add('good'); else if (i === pick) x.classList.add('bad'); });
      if (ok) { score++; wrong = wrong.filter((i) => i !== qi); } else if (wrong.indexOf(qi) < 0) wrong.push(qi);
      store.set('c370-wrong', wrong); retryLabel();
      $('#st-why', s).innerHTML = '<div class="res ' + (ok ? 'good' : 'bad') + '"><b>' + (ok ? 'Correct.' : 'Not quite.') + '</b> ' + q[4] + '</div><div class="row"><button class="btn pri" id="st-next">' + (pos + 1 < list.length ? 'Next question' : 'See score') + '</button></div>';
    } else if (id === 'st-next') { pos++; quiz(); }
    else if (id === 'st-restart') { mode = 'quiz'; list = all.slice(); pos = 0; score = 0; draw(); }
    else if (id === 'st-retry') { const w = wrong.filter((i) => all.indexOf(i) >= 0); if (w.length) { mode = 'quiz'; list = w; pos = 0; score = 0; draw(); } }
    else if (id === 'st-quiz') { mode = 'quiz'; draw(); }

  };
  draw();
}
