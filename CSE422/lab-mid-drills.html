<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSE422 Lab Mid Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* layout idea: a lab bench. Sticky tab rail; each tab is one instrument panel. Drills open as a two-pane editor: read-only program on the left with the blank highlighted, your code on the right, verdict below. */
:root{
  --bg:#f6f4ee; --panel:#fffdf8; --ink:#1b1a17; --mute:#6b675e; --line:#e3ded2;
  --acc:#1f4e3d; --acc-ink:#fff; --warn:#8a5a00; --bad:#9b2b2b; --good:#1d6b3a;
  --code:#f1efe7; --blank:#fff2c2; --tag:#e8e3d6;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --disp:'Bricolage Grotesque','IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
[data-theme=dark]{
  --bg:#15161a; --panel:#1d1f25; --ink:#ece9e1; --mute:#a39f95; --line:#2d3039;
  --acc:#7fcba4; --acc-ink:#0e1a14; --warn:#f0b64a; --bad:#ff7b7b; --good:#7fd69a;
  --code:#15171c; --blank:#4a3f12; --tag:#2b2e37;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 0}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--disp);font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.tools button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
section.tab{display:none}section.tab.on{display:block}
h2{font-family:var(--disp);font-size:20px;margin:18px 0 8px}
h3{font-family:var(--disp);font-size:16px;margin:16px 0 6px}
p{margin:6px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .08s}
.dcard:hover{transform:translateY(-1px);border-color:var(--acc)}
.dcard .t{font-weight:600;font-family:var(--disp);font-size:15px}
.dcard .s{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--tag);border-radius:6px;padding:2px 7px;color:var(--ink)}
.tag.hot{background:var(--acc);color:var(--acc-ink)}
.tag.done{background:var(--good);color:#fff}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:600}
code,pre{font-family:var(--mono);font-size:13px}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;margin:8px 0;white-space:pre;line-height:1.45}
pre.blank-ctx{position:relative}
.pyk{color:#7a3e9d}.pys{color:#1a6b2b}.pyc{color:#8a8578;font-style:italic}.pyn{color:#b35a00}.pyf{color:#1550a8}
[data-theme=dark] .pyk{color:#c792ea}[data-theme=dark] .pys{color:#a5d6a7}[data-theme=dark] .pyc{color:#8b8f99}[data-theme=dark] .pyn{color:#f4b26a}[data-theme=dark] .pyf{color:#82aaff}
.blankline{background:var(--blank);display:block;margin:0 -12px;padding:0 12px}
.editor-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.editor-wrap>div,.two>div,.card{min-width:0}
pre{max-width:100%}
table{display:block;overflow-x:auto}
@media (max-width:860px){.editor-wrap{grid-template-columns:1fr}}
textarea.ed{width:100%;min-height:260px;font-family:var(--mono);font-size:13px;line-height:1.45;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto}
textarea.ed:focus{outline:2px solid var(--acc)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.5;cursor:default}
.verdict{border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:600;border:1px solid var(--line)}
.verdict.pass{background:color-mix(in srgb,var(--good) 15%,var(--panel));border-color:var(--good)}
.verdict.fail{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border-color:var(--bad)}
.verdict.error{background:color-mix(in srgb,var(--warn) 15%,var(--panel));border-color:var(--warn)}
.verdict.wait{background:var(--code)}
.small{font-size:13px;color:var(--mute)}
.note{border-left:4px solid var(--acc);padding:6px 12px;background:var(--code);border-radius:0 10px 10px 0;margin:10px 0}
.warn{border-left:4px solid var(--warn)}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0;background:var(--panel)}
.prio-very{color:var(--bad);font-weight:700}.prio-high{color:var(--warn);font-weight:700}.prio-medium{color:var(--acc);font-weight:600}.prio-low{color:var(--mute)}
.timer{font-family:var(--mono);font-size:28px;font-weight:600}
.timer.low{color:var(--bad)}
.status{font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:860px){.two{grid-template-columns:1fr}}
.crumb{color:var(--mute);font-size:13px;margin-bottom:6px}
.crumb a{cursor:pointer}
.progress{height:8px;background:var(--code);border-radius:999px;overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--good)}
.hidden{display:none !important}
ol.viva li{margin:6px 0}
kbd{font-family:var(--mono);background:var(--code);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
</style>
</head>

<script>
const DRILLS = [{"id": "l1_astar_expand", "lab": 1, "tag": "REAL ASSESSMENT", "title": "A*: the neighbour-expansion step", "summary": "The exact TODO from the real lab assessment paper \"A* Search Lab Question\". Loop over neighbours, compute new g, update g/parent, push (f, neighbour).", "prelude": "import heapq\n\n# Graph as an adjacency list: node -> [(neighbour, edge_cost), ...]\ngraph = {\n    'S': [('A', 2), ('B', 1)],\n    'A': [('S', 2), ('C', 2), ('G', 6)],\n    'B': [('S', 1), ('C', 5)],\n    'C': [('A', 2), ('B', 5), ('G', 1)],\n    'G': [('A', 6), ('C', 1)],\n}\n# Heuristic values h(n)\nh = {'S': 4, 'A': 3, 'B': 5, 'C': 1, 'G': 0}\n\ndef reconstruct_path(parent, goal):\n    path = [goal]\n    while parent[path[-1]] is not None:\n        path.append(parent[path[-1]])\n    return path[::-1]\n\ndef a_star(start, goal):\n    open_list = [(h[start], start)]   # (f, node)\n    g = {start: 0}                    # best known cost from start\n    parent = {start: None}\n    closed = set()\n    order = []                        # expansion order\n    while open_list:\n        f, node = heapq.heappop(open_list)\n        if node in closed:\n            continue\n        closed.add(node)\n        order.append(node)\n        if node == goal:\n            return reconstruct_path(parent, goal), g[goal], order\n", "stub": "        # ===================== TODO =====================\n        # Loop over every neighbour of 'node'.\n        # Compute the new g value through 'node'.\n        # If it is better than the known g value (or the\n        # neighbour has not been seen yet), update g and\n        # parent, then push (f, neighbour) into open_list.\n        # ================================================\n        pass\n", "solution": "        for neighbour, cost in graph[node]:\n            new_g = g[node] + cost\n            if neighbour not in g or new_g < g[neighbour]:\n                g[neighbour] = new_g\n                parent[neighbour] = node\n                heapq.heappush(open_list, (new_g + h[neighbour], neighbour))\n", "postlude": "    return None, float('inf'), order\n\npath, cost, order = a_star('S', 'G')\nprint(\"Expansion order:\", \" -> \".join(order))\nprint(\"Path:\", \" -> \".join(path))\nprint(\"Cost:\", cost)\n", "expected": "Expansion order: S -> A -> C -> G\nPath: S -> A -> C -> G\nCost: 5", "tests": "\ndef check(ns, ref):\n    import random\n    p, c, o = ns['a_star']('S', 'G')\n    assert (p, c, o) == (['S','A','C','G'], 5, ['S','A','C','G']), \"On the paper's graph expected path S->A->C->G, cost 5, order S->A->C->G; got %r %r %r\" % (p, c, o)\n    # random graphs\n    rnd = random.Random(1)\n    for t in range(40):\n        n = rnd.randint(4, 7)\n        nodes = [chr(65+i) for i in range(n)]\n        edges = {}\n        for i in range(n):\n            for j in range(i+1, n):\n                if rnd.random() < 0.5:\n                    edges[(nodes[i], nodes[j])] = rnd.randint(1, 9)\n        gph = {v: [] for v in nodes}\n        for (a, b), w in edges.items():\n            gph[a].append((b, w)); gph[b].append((a, w))\n        hh = {v: rnd.randint(0, 3) for v in nodes}; hh[nodes[-1]] = 0\n        for d in (ns, ref):\n            d['graph'] = gph; d['h'] = hh\n        r1 = ns['a_star'](nodes[0], nodes[-1]); r2 = ref['a_star'](nodes[0], nodes[-1])\n        assert r1[1] == r2[1], \"Wrong cost on a random graph: yours %r, expected %r (graph=%r, h=%r)\" % (r1[1], r2[1], gph, hh)\n        assert r1[0] == r2[0], \"Wrong path on a random graph: yours %r, expected %r\" % (r1[0], r2[0])\n        assert r1[2] == r2[2], \"Wrong expansion order on a random graph: yours %r, expected %r\" % (r1[2], r2[2])\n", "hint": "Three lines of logic: new_g = g[node] + cost; the condition is \"neighbour not in g or new_g < g[neighbour]\"; the push is heapq.heappush(open_list, (new_g + h[neighbour], neighbour)).", "notes": "This is word-for-word the blank on a real assessment paper. The paper prints \"Cost: ?\" — the answer is 5, path S→A→C→G. Note the frontier stores (f, node) and f = g + h is computed at push time. The pop+closed check at the top is what makes re-pushing a node with a better g safe.", "viva": ["Why do we check \"node in closed\" after popping instead of before pushing? (A node can be pushed twice with different f; the first pop is the best one, later pops are skipped.)", "What changes if h is inadmissible? (A* can return a sub-optimal path — e.g. if h(A) were 20 it would go S→B→C→G cost 7.)"]}, {"id": "l1_gbfs_expand", "lab": 1, "tag": "REAL ASSESSMENT", "title": "Greedy Best-First: the neighbour step", "summary": "The exact TODO from the real assessment \"CSE422 Lab 01 section 2\". Same skeleton as A*, but the frontier is ordered by h only and a node is pushed once.", "prelude": "import heapq\n\ngraph = {\n    'S': [('A', 2), ('B', 4)],\n    'A': [('S', 2), ('C', 4), ('G', 12)],\n    'B': [('S', 4), ('C', 1), ('G', 7)],\n    'C': [('A', 4), ('B', 1), ('G', 3)],\n    'G': [('A', 12), ('B', 7), ('C', 3)],\n}\nh = {'S': 6, 'A': 4, 'B': 3, 'C': 3, 'G': 0}\n\ndef reconstruct_path(parent, goal):\n    path = [goal]\n    while parent[path[-1]] is not None:\n        path.append(parent[path[-1]])\n    return path[::-1]\n\ndef greedy_best_first(start, goal):\n    open_list = [(h[start], start)]   # (h, node)  <- ordered by h ONLY\n    g = {start: 0}                     # cost of the path used (only for printing)\n    parent = {start: None}\n    closed = set()\n    order = []                         # expansion order\n    while open_list:\n        _, node = heapq.heappop(open_list)\n        if node in closed:\n            continue\n        closed.add(node)\n        order.append(node)\n        if node == goal:\n            return reconstruct_path(parent, goal), g[goal], order\n", "stub": "        # ===================== TODO =====================\n        # Loop over every neighbour of 'node'.\n        # If the neighbour is not in closed and has not\n        # been seen yet (not in parent):\n        #   - record its path cost in g\n        #   - set its parent to 'node'\n        #   - push (h, neighbour) into open_list\n        # ================================================\n        pass\n", "solution": "        for neighbour, cost in graph[node]:\n            if neighbour not in closed and neighbour not in parent:\n                g[neighbour] = g[node] + cost\n                parent[neighbour] = node\n                heapq.heappush(open_list, (h[neighbour], neighbour))\n", "postlude": "    return None, float('inf'), order\n\npath, cost, order = greedy_best_first('S', 'G')\nprint(\"Expansion order:\", \" -> \".join(order))\nif path is None:\n    print(\"NO PATH FOUND\")\nelse:\n    print(\"Path:\", \" -> \".join(path))\n    print(\"Cost:\", cost)\n", "expected": "Expansion order: S -> B -> G\nPath: S -> B -> G\nCost: 11", "tests": "\ndef check(ns, ref):\n    import random\n    p, c, o = ns['greedy_best_first']('S', 'G')\n    assert (p, c, o) == (['S','B','G'], 11, ['S','B','G']), \"On the paper's graph expected path S->B->G, cost 11, order S->B->G; got %r %r %r\" % (p, c, o)\n    rnd = random.Random(2)\n    for t in range(40):\n        n = rnd.randint(4, 7)\n        nodes = [chr(65+i) for i in range(n)]\n        gph = {v: [] for v in nodes}\n        for i in range(n):\n            for j in range(i+1, n):\n                if rnd.random() < 0.5:\n                    w = rnd.randint(1, 9); gph[nodes[i]].append((nodes[j], w)); gph[nodes[j]].append((nodes[i], w))\n        hh = {v: rnd.randint(0, 9) for v in nodes}; hh[nodes[-1]] = 0\n        for d in (ns, ref):\n            d['graph'] = gph; d['h'] = hh\n        r1 = ns['greedy_best_first'](nodes[0], nodes[-1]); r2 = ref['greedy_best_first'](nodes[0], nodes[-1])\n        assert r1 == r2, \"Mismatch on a random graph: yours %r, expected %r (graph=%r, h=%r)\" % (r1, r2, gph, hh)\n", "hint": "Greedy never updates g: the condition is \"neighbour not in closed and neighbour not in parent\", and the push is (h[neighbour], neighbour) — no g in the priority.", "notes": "Second real assessment paper. Expected output: order S→B→G, path S→B→G, cost 11 — but the optimal path is S→B→C→G with cost 8. That is the whole point of greedy search: it is fast but not optimal. Say this in the viva.", "viva": ["Is the greedy result optimal here? (No: 11 vs the true optimum 8 via C.)", "Why do we still track g if it is not used for ordering? (Only to print the cost of the path found.)"]}, {"id": "l1_reconstruct", "lab": 1, "tag": "LIKELY BLANK", "title": "reconstruct_path from the parent dictionary", "summary": "The helper every search program has. Follow parent links from the goal back to the start, then reverse.", "prelude": "# parent maps each node to the node it was reached from; the start maps to None\n", "stub": "def reconstruct_path(parent, goal):\n    # TODO: follow parent links from goal back to the start,\n    # then return the path in start -> goal order\n    pass\n", "solution": "def reconstruct_path(parent, goal):\n    path = [goal]\n    while parent[path[-1]] is not None:\n        path.append(parent[path[-1]])\n    return path[::-1]\n", "postlude": "\nparent = {'S': None, 'A': 'S', 'C': 'A', 'G': 'C', 'B': 'S'}\nprint(reconstruct_path(parent, 'G'))\n", "expected": "['S', 'A', 'C', 'G']", "tests": "\ndef check(ns, ref):\n    f = ns['reconstruct_path']\n    assert f({'S': None, 'A': 'S', 'C': 'A', 'G': 'C', 'B': 'S'}, 'G') == ['S','A','C','G']\n    assert f({'S': None}, 'S') == ['S'], \"A goal that is the start should give [start]\"\n    assert f({'S': None, 'X': 'S'}, 'X') == ['S','X']\n    chain = {'N0': None}\n    for i in range(1, 30): chain['N%d' % i] = 'N%d' % (i-1)\n    assert f(chain, 'N29') == ['N%d' % i for i in range(30)]\n", "hint": "Start with path = [goal]; while parent[path[-1]] is not None, append parent[path[-1]]; return path[::-1].", "notes": "Variants to expect: return the path as a string \"S -> A -> G\" (use \" -> \".join(path)), or return it as a list of (node, cost) pairs.", "viva": []}, {"id": "l1_ucs", "lab": 1, "tag": "TWEAK", "title": "Tweak: turn A* into Uniform-Cost Search", "summary": "Same program, but the frontier is ordered by g only (h is ignored). A one-line change in the push — you must know which line.", "prelude": "import heapq\n\n# Graph as an adjacency list: node -> [(neighbour, edge_cost), ...]\ngraph = {\n    'S': [('A', 2), ('B', 1)],\n    'A': [('S', 2), ('C', 2), ('G', 6)],\n    'B': [('S', 1), ('C', 5)],\n    'C': [('A', 2), ('B', 5), ('G', 1)],\n    'G': [('A', 6), ('C', 1)],\n}\n# Heuristic values h(n)\nh = {'S': 4, 'A': 3, 'B': 5, 'C': 1, 'G': 0}\n\ndef reconstruct_path(parent, goal):\n    path = [goal]\n    while parent[path[-1]] is not None:\n        path.append(parent[path[-1]])\n    return path[::-1]\n\ndef ucs(start, goal):\n    open_list = [(0, start)]   # (f, node)\n    g = {start: 0}                    # best known cost from start\n    parent = {start: None}\n    closed = set()\n    order = []                        # expansion order\n    while open_list:\n        f, node = heapq.heappop(open_list)\n        if node in closed:\n            continue\n        closed.add(node)\n        order.append(node)\n        if node == goal:\n            return reconstruct_path(parent, goal), g[goal], order\n", "stub": "        # TODO: expand 'node' so that the frontier is ordered by g ONLY\n        # (uniform-cost search). Update g/parent exactly as in A*.\n        pass\n", "solution": "        for neighbour, cost in graph[node]:\n            new_g = g[node] + cost\n            if neighbour not in g or new_g < g[neighbour]:\n                g[neighbour] = new_g\n                parent[neighbour] = node\n                heapq.heappush(open_list, (new_g, neighbour))\n", "postlude": "    return None, float('inf'), order\n\npath, cost, order = ucs('S', 'G')\nprint(\"Expansion order:\", \" -> \".join(order))\nprint(\"Path:\", \" -> \".join(path))\nprint(\"Cost:\", cost)\n", "expected": "Expansion order: S -> B -> A -> C -> G\nPath: S -> A -> C -> G\nCost: 5", "tests": "\ndef check(ns, ref):\n    import random\n    r = ns['ucs']('S', 'G')\n    assert r == (['S','A','C','G'], 5, ['S','B','A','C','G']), \"Expected path S->A->C->G cost 5 and order S->B->A->C->G; got %r\" % (r,)\n    rnd = random.Random(3)\n    for t in range(30):\n        n = rnd.randint(4, 7); nodes = [chr(65+i) for i in range(n)]\n        gph = {v: [] for v in nodes}\n        for i in range(n):\n            for j in range(i+1, n):\n                if rnd.random() < 0.55:\n                    w = rnd.randint(1, 9); gph[nodes[i]].append((nodes[j], w)); gph[nodes[j]].append((nodes[i], w))\n        for d in (ns, ref): d['graph'] = gph\n        assert ns['ucs'](nodes[0], nodes[-1]) == ref['ucs'](nodes[0], nodes[-1]), \"Mismatch on random graph %r\" % gph\n", "hint": "Identical to the A* expansion except the pushed priority is new_g, not new_g + h[neighbour].", "notes": "Know the three siblings: UCS pushes g; Greedy pushes h; A* pushes g + h. A tweak question may give you one and ask for another — or ask you to make A* \"weighted\" (push g + 2*h).", "viva": []}, {"id": "l1_maze_neighbours", "lab": 1, "tag": "ASSIGNMENT CORE", "title": "Maze A*: generate the four neighbours", "summary": "From Lab 1 Part 1 (maze solver). Try U, D, L, R; keep a move only if it is inside the grid, on a \"0\" cell and not visited; push with the new g, f and the path string.", "prelude": "import heapq\n\ndef manhattan(r1, c1, r2, c2):\n    return abs(r1 - r2) + abs(c1 - c2)\n\ndef a_star_maze(n, m, start, goal, maze):\n    sr, sc = start\n    gr, gc = goal\n    # heap entries: (f, g, row, col, path_string)\n    heap = [(manhattan(sr, sc, gr, gc), 0, sr, sc, \"\")]\n    visited = {}\n    while heap:\n        f, g, r, c, path = heapq.heappop(heap)\n        if (r, c) in visited:\n            continue\n        visited[(r, c)] = g\n        if (r, c) == (gr, gc):\n            return g, path\n", "stub": "        # TODO: for each of the four moves (U, D, L, R):\n        #   compute the new cell (nr, nc)\n        #   skip it if it is outside the maze, is a wall '#', or is already visited\n        #   push (new_f, new_g, nr, nc, path + action) onto the heap\n        pass\n", "solution": "        for dr, dc, action in [(-1, 0, 'U'), (1, 0, 'D'), (0, -1, 'L'), (0, 1, 'R')]:\n            nr, nc = r + dr, c + dc\n            if 0 <= nr < n and 0 <= nc < m and maze[nr][nc] == '0' and (nr, nc) not in visited:\n                ng = g + 1\n                nf = ng + manhattan(nr, nc, gr, gc)\n                heapq.heappush(heap, (nf, ng, nr, nc, path + action))\n", "postlude": "    return -1, None\n\nmaze = [\"###0####\", \"#000000#\", \"###0#00#\", \"#000#00#\", \"#0######\", \"#000000#\", \"#####0##\"]\ncost, path = a_star_maze(7, 8, (0, 3), (6, 5), maze)\nprint(cost)\nprint(path)\n", "expected": "12\nDDDLLDDRRRRD", "tests": "\ndef check(ns, ref):\n    import random\n    maze = [\"###0####\", \"#000000#\", \"###0#00#\", \"#000#00#\", \"#0######\", \"#000000#\", \"#####0##\"]\n    r = ns['a_star_maze'](7, 8, (0, 3), (6, 5), maze)\n    assert r == (12, 'DDDLLDDRRRRD'), \"Sample maze: expected (12, 'DDDLLDDRRRRD'), got %r\" % (r,)\n    m2 = [\"#0##########\",\"#000000###0#\",\"###0###0##0#\",\"#0#0#000##0#\",\"#0#0###0##0#\",\"#0000#00##0#\",\"###0###0##0#\",\"#000#0000#0#\",\"#0#####0000#\",\"#######0####\"]\n    assert ns['a_star_maze'](10, 12, (0, 1), (9, 8), m2) == (-1, None), \"Unreachable goal must return (-1, None)\"\n    rnd = random.Random(5)\n    for t in range(25):\n        n, m = rnd.randint(3, 7), rnd.randint(3, 7)\n        g = [''.join('#' if rnd.random() < 0.28 else '0' for _ in range(m)) for _ in range(n)]\n        cells = [(i, j) for i in range(n) for j in range(m) if g[i][j] == '0']\n        if len(cells) < 2: continue\n        s, e = rnd.sample(cells, 2)\n        a = ns['a_star_maze'](n, m, s, e, g); b = ref['a_star_maze'](n, m, s, e, g)\n        assert a[0] == b[0], \"Random maze %r start %r goal %r: cost %r, expected %r\" % (g, s, e, a[0], b[0])\n        if a[0] != -1:\n            # path must be valid and of the right length (several optimal paths may exist)\n            r_, c_ = s\n            for ch in a[1]:\n                dr, dc = {'U': (-1,0), 'D': (1,0), 'L': (0,-1), 'R': (0,1)}[ch]\n                r_, c_ = r_ + dr, c_ + dc\n                assert 0 <= r_ < n and 0 <= c_ < m and g[r_][c_] == '0', \"Path walks into a wall or off the grid\"\n            assert (r_, c_) == e and len(a[1]) == a[0], \"Path does not end at the goal / length != cost\"\n", "hint": "Four tuples (dr, dc, letter). Bounds check first: 0 <= nr < n and 0 <= nc < m, THEN maze[nr][nc] == \"0\" (order matters — indexing out of range crashes).", "notes": "Tweaks the examiner can make: allow diagonal moves (add four more tuples, cost √2 or 1), use Euclidean distance, make \".\" the path symbol, or print the coordinates instead of letters. The structure stays the same.", "viva": ["Why is visited a dict storing g and not just a set? (Either works here; the dict lets you print or verify the cost at which each cell was settled.)", "Why check (nr, nc) not in visited at push time AND at pop time? (Push-time check avoids useless pushes; pop-time check is what guarantees correctness.)"]}, {"id": "l1_admissible", "lab": 1, "tag": "ASSIGNMENT CORE", "title": "Admissibility checker (BFS from the goal)", "summary": "Lab 1 Part 2. Compute the true distance of every node to the goal with BFS, then list the nodes whose h is larger than that.", "prelude": "from collections import deque\n\ndef bfs_from_goal(graph, goal):\n    \"\"\"True (unweighted) distance from every node to the goal.\"\"\"\n    dist = {goal: 0}\n    queue = deque([goal])\n    while queue:\n        u = queue.popleft()\n        for v in graph[u]:\n            if v not in dist:\n                dist[v] = dist[u] + 1\n                queue.append(v)\n    return dist\n", "stub": "def inadmissible_nodes(graph, heuristics, goal):\n    \"\"\"Return the sorted list of nodes whose heuristic overestimates\n    the true distance to the goal. Unreachable nodes have distance infinity.\"\"\"\n    # TODO\n    pass\n", "solution": "def inadmissible_nodes(graph, heuristics, goal):\n    true_dist = bfs_from_goal(graph, goal)\n    bad = []\n    for node in graph:\n        actual = true_dist.get(node, float('inf'))\n        if heuristics[node] > actual:\n            bad.append(node)\n    return sorted(bad)\n", "postlude": "\ngraph = {1: [2, 4], 2: [1, 3], 3: [2, 6, 5], 4: [1, 5], 5: [4, 6, 3], 6: [3, 5]}\nheur  = {1: 6, 2: 4, 3: 2, 4: 5, 5: 2, 6: 0}\nbad = inadmissible_nodes(graph, heur, 6)\nif not bad:\n    print(\"The heuristic values are admissible.\")\nelse:\n    print(0)\n    print(\"Here nodes \" + \", \".join(str(x) for x in bad) + \" are inadmissible.\")\n", "expected": "0\nHere nodes 1, 2, 3, 4, 5 are inadmissible.", "tests": "\ndef check(ns, ref):\n    import random\n    graph = {1: [2, 4], 2: [1, 3], 3: [2, 6, 5], 4: [1, 5], 5: [4, 6, 3], 6: [3, 5]}\n    assert ns['inadmissible_nodes'](graph, {1: 6, 2: 4, 3: 2, 4: 5, 5: 2, 6: 0}, 6) == [1,2,3,4,5]\n    assert ns['inadmissible_nodes'](graph, {1: 3, 2: 2, 3: 1, 4: 2, 5: 1, 6: 0}, 6) == []\n    rnd = random.Random(7)\n    for t in range(30):\n        n = rnd.randint(3, 8); g = {i: [] for i in range(1, n+1)}\n        for i in range(1, n+1):\n            for j in range(i+1, n+1):\n                if rnd.random() < 0.4: g[i].append(j); g[j].append(i)\n        hh = {i: rnd.randint(0, 4) for i in g}; goal = rnd.randint(1, n); hh[goal] = 0\n        assert ns['inadmissible_nodes'](g, hh, goal) == ref['inadmissible_nodes'](g, hh, goal), \"Mismatch for graph %r h %r goal %r\" % (g, hh, goal)\n", "hint": "true_dist = bfs_from_goal(graph, goal); for each node: actual = true_dist.get(node, float(\"inf\")); it is inadmissible if heuristics[node] > actual.", "notes": "Tweak to expect: a CONSISTENCY checker — for every edge (u, v) with cost c, flag it if h[u] > c + h[v]. Or: weighted edges, where the BFS becomes Dijkstra.", "viva": []}, {"id": "l1_consistent", "lab": 1, "tag": "TWEAK", "title": "Tweak: consistency checker on a weighted graph", "summary": "Return every edge (u, v) that violates h(u) ≤ c(u, v) + h(v). Check both directions of each undirected edge.", "prelude": "# graph: node -> [(neighbour, cost), ...]  (undirected: both directions listed)\n", "stub": "def inconsistent_edges(graph, h):\n    \"\"\"Return a sorted list of (u, v) pairs with h[u] > cost(u, v) + h[v].\"\"\"\n    # TODO\n    pass\n", "solution": "def inconsistent_edges(graph, h):\n    bad = []\n    for u in graph:\n        for v, cost in graph[u]:\n            if h[u] > cost + h[v]:\n                bad.append((u, v))\n    return sorted(bad)\n", "postlude": "\ngraph = {'S': [('A', 10), ('B', 2)], 'A': [('S', 10), ('B', 2), ('G', 10)],\n         'B': [('S', 2), ('A', 2), ('G', 15)], 'G': [('A', 10), ('B', 15)]}\nh = {'S': 12, 'A': 7, 'B': 10, 'G': 0}\nprint(inconsistent_edges(graph, h))\n", "expected": "[('B', 'A')]", "tests": "\ndef check(ns, ref):\n    import random\n    graph = {'S': [('A', 10), ('B', 2)], 'A': [('S', 10), ('B', 2), ('G', 10)], 'B': [('S', 2), ('A', 2), ('G', 15)], 'G': [('A', 10), ('B', 15)]}\n    assert ns['inconsistent_edges'](graph, {'S': 12, 'A': 7, 'B': 10, 'G': 0}) == [('B','A')], \"Notes example: only B->A (10 > 2+7) is inconsistent\"\n    rnd = random.Random(9)\n    for t in range(30):\n        n = rnd.randint(3, 7); nodes = [chr(65+i) for i in range(n)]; g = {v: [] for v in nodes}\n        for i in range(n):\n            for j in range(i+1, n):\n                if rnd.random() < 0.5:\n                    w = rnd.randint(1, 9); g[nodes[i]].append((nodes[j], w)); g[nodes[j]].append((nodes[i], w))\n        hh = {v: rnd.randint(0, 12) for v in nodes}\n        assert ns['inconsistent_edges'](g, hh) == ref['inconsistent_edges'](g, hh), \"Mismatch on %r %r\" % (g, hh)\n", "hint": "Two nested loops over the adjacency list; the test is h[u] > cost + h[v]. Because both directions are listed, you automatically check both.", "notes": "From the IBU notes example: h(B)=10 but B→A costs 2 and h(A)=7, so 10 > 9. Consistent ⇒ admissible, not the reverse.", "viva": []}, {"id": "l1_full_astar", "lab": 1, "tag": "HARD", "title": "Write the whole A* function", "summary": "The worst case: the entire function is the blank. Same graph as the real paper. Return (path, cost, expansion order).", "prelude": "import heapq\n\ngraph = {\n    'S': [('A', 2), ('B', 1)],\n    'A': [('S', 2), ('C', 2), ('G', 6)],\n    'B': [('S', 1), ('C', 5)],\n    'C': [('A', 2), ('B', 5), ('G', 1)],\n    'G': [('A', 6), ('C', 1)],\n}\nh = {'S': 4, 'A': 3, 'B': 5, 'C': 1, 'G': 0}\n\ndef reconstruct_path(parent, goal):\n    path = [goal]\n    while parent[path[-1]] is not None:\n        path.append(parent[path[-1]])\n    return path[::-1]\n", "stub": "def a_star(start, goal):\n    \"\"\"Return (path_list, cost, expansion_order). (None, inf, order) if no path.\"\"\"\n    # TODO: write the whole algorithm\n    pass\n", "solution": "def a_star(start, goal):\n    open_list = [(h[start], start)]\n    g = {start: 0}\n    parent = {start: None}\n    closed = set()\n    order = []\n    while open_list:\n        f, node = heapq.heappop(open_list)\n        if node in closed:\n            continue\n        closed.add(node)\n        order.append(node)\n        if node == goal:\n            return reconstruct_path(parent, goal), g[goal], order\n        for neighbour, cost in graph[node]:\n            new_g = g[node] + cost\n            if neighbour not in g or new_g < g[neighbour]:\n                g[neighbour] = new_g\n                parent[neighbour] = node\n                heapq.heappush(open_list, (new_g + h[neighbour], neighbour))\n    return None, float('inf'), order\n", "postlude": "\npath, cost, order = a_star('S', 'G')\nprint(\"Expansion order:\", \" -> \".join(order))\nprint(\"Path:\", \" -> \".join(path))\nprint(\"Cost:\", cost)\n", "expected": "Expansion order: S -> A -> C -> G\nPath: S -> A -> C -> G\nCost: 5", "tests": "\ndef check(ns, ref):\n    import random\n    assert ns['a_star']('S', 'G') == (['S','A','C','G'], 5, ['S','A','C','G'])\n    rnd = random.Random(11)\n    for t in range(40):\n        n = rnd.randint(4, 7); nodes = [chr(65+i) for i in range(n)]; gph = {v: [] for v in nodes}\n        for i in range(n):\n            for j in range(i+1, n):\n                if rnd.random() < 0.5:\n                    w = rnd.randint(1, 9); gph[nodes[i]].append((nodes[j], w)); gph[nodes[j]].append((nodes[i], w))\n        hh = {v: rnd.randint(0, 3) for v in nodes}; hh[nodes[-1]] = 0\n        for d in (ns, ref): d['graph'] = gph; d['h'] = hh\n        a = ns['a_star'](nodes[0], nodes[-1]); b = ref['a_star'](nodes[0], nodes[-1])\n        assert a[1] == b[1] and a[0] == b[0], \"Mismatch on random graph %r h %r: yours %r expected %r\" % (gph, hh, a, b)\n", "hint": "Five pieces: open_list=[(h[start], start)], g={start:0}, parent={start:None}, closed=set(), order=[]; then the pop / closed-check / goal-check / expand loop.", "notes": "Memorise this shape — the GBFS and UCS versions are two-token edits of it.", "viva": []}, {"id": "l2_create_pop", "lab": 2, "tag": "REAL ASSESSMENT", "title": "Vault GA: create_population", "summary": "The first TODO of the real GA assessment (Fall 26): 4 random 10-bit strings of 0/1.", "prelude": "import random\n\nCHROMOSOME_LENGTH = 10\nPOPULATION_SIZE = 4\nMUTATION_RATE = 0.1\nMAX_GENERATIONS = 3000\nMASTER_KEY = \"1\" * CHROMOSOME_LENGTH   # 1111111111\n", "stub": "# ---------------- Step 1: Create the population ----------------\ndef create_population(size=POPULATION_SIZE, length=CHROMOSOME_LENGTH):\n    \"\"\"Return a list of `size` random chromosomes.\n    Each chromosome is a string of `length` random 0s and 1s, e.g. '0100110111'.\"\"\"\n    population = []\n    # TODO\n    return population\n\ndef fitness(chromosome):\n    return sum(1 for a, b in zip(chromosome, MASTER_KEY) if a == b)\n\ndef selection(population):\n    return random.choice(population)\n", "solution": "# ---------------- Step 1: Create the population ----------------\ndef create_population(size=POPULATION_SIZE, length=CHROMOSOME_LENGTH):\n    \"\"\"Return a list of `size` random chromosomes.\n    Each chromosome is a string of `length` random 0s and 1s, e.g. '0100110111'.\"\"\"\n    population = []\n    for _ in range(size):\n        chromosome = \"\"\n        for _ in range(length):\n            chromosome += random.choice(\"01\")\n        population.append(chromosome)\n    return population\n\ndef fitness(chromosome):\n    return sum(1 for a, b in zip(chromosome, MASTER_KEY) if a == b)\n\ndef selection(population):\n    return random.choice(population)\n", "postlude": "\n# ---------------- Step 3a: Single-point crossover ----------------\ndef crossover(parent1, parent2):\n    \"\"\"Cut both parents at the same random point and swap the tails.\"\"\"\n    point = random.randint(1, len(parent1) - 1)\n    child1 = parent1[:point] + parent2[point:]\n    child2 = parent2[:point] + parent1[point:]\n    return child1, child2\n\n# ---------------- Step 3b: Mutation ----------------\ndef mutation(chromosome, rate=MUTATION_RATE):\n    \"\"\"Each bit has a `rate` chance of being flipped.\"\"\"\n    new_chromosome = \"\"\n    for bit in chromosome:\n        if random.random() < rate:\n            new_chromosome += \"1\" if bit == \"0\" else \"0\"\n        else:\n            new_chromosome += bit\n    return new_chromosome\n\n# ---------------- Main GA loop (do not change) ----------------\ndef genetic_algorithm():\n    population = create_population()\n    for generation in range(MAX_GENERATIONS):\n        scores = [fitness(c) for c in population]\n        if MASTER_KEY in population:\n            print(\"Vault unlocked! Master Key \" + MASTER_KEY + \" found in generation \" + str(generation) + \".\")\n            return MASTER_KEY, generation\n        new_population = []\n        while len(new_population) < POPULATION_SIZE:\n            parent1 = selection(population)\n            parent2 = selection(population)\n            child1, child2 = crossover(parent1, parent2)\n            new_population.append(mutation(child1))\n            new_population.append(mutation(child2))\n        population = new_population[:POPULATION_SIZE]\n    best = max(population, key=fitness)\n    print(\"Not found. Best: \" + best + \" (fitness \" + str(fitness(best)) + \")\")\n    return best, MAX_GENERATIONS\n\nrandom.seed(1)\ngenetic_algorithm()\n", "expected": "Vault unlocked! Master Key 1111111111 found in generation N.   (N varies with the random seed)", "tests": "\ndef check(ns, ref):\n    import random\n    f = ns['create_population']\n    for size, length in [(4, 10), (1, 1), (6, 3), (10, 20)]:\n        pop = f(size, length)\n        assert isinstance(pop, list) and len(pop) == size, \"create_population(%d, %d) must return a list of %d strings\" % (size, length, size)\n        for c in pop:\n            assert isinstance(c, str) and len(c) == length, \"Each chromosome must be a string of length %d, got %r\" % (length, c)\n            assert set(c) <= set(\"01\"), \"Chromosomes may only contain '0' and '1', got %r\" % c\n    pop = f()\n    assert len(pop) == 4 and all(len(c) == 10 for c in pop), \"Defaults must give 4 chromosomes of length 10\"\n    big = f(200, 10)\n    ones = sum(c.count(\"1\") for c in big)\n    assert 700 <= ones <= 1300, \"Bits do not look random (got %d ones out of 2000)\" % ones\n    assert len(set(big)) > 50, \"All chromosomes look identical — generate each one separately\"\n", "hint": "Two nested loops, or one line per chromosome: \"\".join(random.choice(\"01\") for _ in range(length)). Append to population; return it.", "notes": "Classic slips: building one random string and appending it 4 times (all identical); using random.randint(0, 1) and forgetting str(); returning a list of lists instead of strings.", "viva": ["Why does the initial population need diversity? (Identical parents produce identical children; only mutation could ever change anything.)"]}, {"id": "l2_fitness_key", "lab": 2, "tag": "REAL ASSESSMENT", "title": "Vault GA: fitness = matching positions", "summary": "Second TODO of the real GA assessment: count the positions where the chromosome equals the master key.", "prelude": "import random\n\nCHROMOSOME_LENGTH = 10\nPOPULATION_SIZE = 4\nMUTATION_RATE = 0.1\nMAX_GENERATIONS = 3000\nMASTER_KEY = \"1\" * CHROMOSOME_LENGTH   # 1111111111\n\ndef create_population(size=POPULATION_SIZE, length=CHROMOSOME_LENGTH):\n    return [\"\".join(random.choice(\"01\") for _ in range(length)) for _ in range(size)]\n", "stub": "# ---------------- Step 2: Fitness function ----------------\ndef fitness(chromosome):\n    \"\"\"Number of positions that match the master key.\"\"\"\n    fitness_score = 0\n    # TODO\n    return fitness_score\n\ndef selection(population):\n    return random.choice(population)\n", "solution": "# ---------------- Step 2: Fitness function ----------------\ndef fitness(chromosome):\n    \"\"\"Number of positions that match the master key.\"\"\"\n    fitness_score = 0\n    for i in range(len(chromosome)):\n        if chromosome[i] == MASTER_KEY[i]:\n            fitness_score += 1\n    return fitness_score\n\ndef selection(population):\n    return random.choice(population)\n", "postlude": "\n# ---------------- Step 3a: Single-point crossover ----------------\ndef crossover(parent1, parent2):\n    \"\"\"Cut both parents at the same random point and swap the tails.\"\"\"\n    point = random.randint(1, len(parent1) - 1)\n    child1 = parent1[:point] + parent2[point:]\n    child2 = parent2[:point] + parent1[point:]\n    return child1, child2\n\n# ---------------- Step 3b: Mutation ----------------\ndef mutation(chromosome, rate=MUTATION_RATE):\n    \"\"\"Each bit has a `rate` chance of being flipped.\"\"\"\n    new_chromosome = \"\"\n    for bit in chromosome:\n        if random.random() < rate:\n            new_chromosome += \"1\" if bit == \"0\" else \"0\"\n        else:\n            new_chromosome += bit\n    return new_chromosome\n\n# ---------------- Main GA loop (do not change) ----------------\ndef genetic_algorithm():\n    population = create_population()\n    for generation in range(MAX_GENERATIONS):\n        scores = [fitness(c) for c in population]\n        if MASTER_KEY in population:\n            print(\"Vault unlocked! Master Key \" + MASTER_KEY + \" found in generation \" + str(generation) + \".\")\n            return MASTER_KEY, generation\n        new_population = []\n        while len(new_population) < POPULATION_SIZE:\n            parent1 = selection(population)\n            parent2 = selection(population)\n            child1, child2 = crossover(parent1, parent2)\n            new_population.append(mutation(child1))\n            new_population.append(mutation(child2))\n        population = new_population[:POPULATION_SIZE]\n    best = max(population, key=fitness)\n    print(\"Not found. Best: \" + best + \" (fitness \" + str(fitness(best)) + \")\")\n    return best, MAX_GENERATIONS\n\nrandom.seed(1)\ngenetic_algorithm()\n", "expected": "Vault unlocked! Master Key 1111111111 found in generation N.", "tests": "\ndef check(ns, ref):\n    f = ns['fitness']\n    assert f(\"1111111111\") == 10\n    assert f(\"0000000000\") == 0\n    assert f(\"0100110111\") == 6, \"'0100110111' has 6 ones -> fitness 6\"\n    assert f(\"1010101010\") == 5\n    import random\n    rnd = random.Random(3)\n    for _ in range(50):\n        c = \"\".join(rnd.choice(\"01\") for _ in range(10))\n        assert f(c) == c.count(\"1\"), \"fitness(%r) should be %d\" % (c, c.count(\"1\"))\n", "hint": "Loop over the indices; compare chromosome[i] with MASTER_KEY[i]. (Since the key is all 1s, chromosome.count(\"1\") also works — but write it generally.)", "notes": "Tweak to expect: a different target key (e.g. \"1010101010\"), a fitness that is a Hamming DISTANCE to minimise, or a target that is a word (\"HELLO\") with chromosomes made of letters.", "viva": []}, {"id": "l2_random_select", "lab": 2, "tag": "REAL ASSESSMENT", "title": "Vault GA: random selection", "summary": "Third TODO of the real GA assessment: pick one chromosome at random, ignoring fitness.", "prelude": "import random\n\nCHROMOSOME_LENGTH = 10\nPOPULATION_SIZE = 4\nMUTATION_RATE = 0.1\nMAX_GENERATIONS = 3000\nMASTER_KEY = \"1\" * CHROMOSOME_LENGTH   # 1111111111\n\ndef create_population(size=POPULATION_SIZE, length=CHROMOSOME_LENGTH):\n    return [\"\".join(random.choice(\"01\") for _ in range(length)) for _ in range(size)]\n\ndef fitness(chromosome):\n    return sum(1 for a, b in zip(chromosome, MASTER_KEY) if a == b)\n", "stub": "# ---------------- Selection ----------------\ndef selection(population):\n    \"\"\"Random selection: pick one chromosome from the population at random,\n    without looking at fitness.\"\"\"\n    # TODO\n    # (The line below will give an error until you write your code above.)\n    return chromosome   # you may change this variable\n", "solution": "# ---------------- Selection ----------------\ndef selection(population):\n    \"\"\"Random selection: pick one chromosome from the population at random,\n    without looking at fitness.\"\"\"\n    chromosome = random.choice(population)\n    return chromosome\n", "postlude": "\n# ---------------- Step 3a: Single-point crossover ----------------\ndef crossover(parent1, parent2):\n    \"\"\"Cut both parents at the same random point and swap the tails.\"\"\"\n    point = random.randint(1, len(parent1) - 1)\n    child1 = parent1[:point] + parent2[point:]\n    child2 = parent2[:point] + parent1[point:]\n    return child1, child2\n\n# ---------------- Step 3b: Mutation ----------------\ndef mutation(chromosome, rate=MUTATION_RATE):\n    \"\"\"Each bit has a `rate` chance of being flipped.\"\"\"\n    new_chromosome = \"\"\n    for bit in chromosome:\n        if random.random() < rate:\n            new_chromosome += \"1\" if bit == \"0\" else \"0\"\n        else:\n            new_chromosome += bit\n    return new_chromosome\n\n# ---------------- Main GA loop (do not change) ----------------\ndef genetic_algorithm():\n    population = create_population()\n    for generation in range(MAX_GENERATIONS):\n        scores = [fitness(c) for c in population]\n        if MASTER_KEY in population:\n            print(\"Vault unlocked! Master Key \" + MASTER_KEY + \" found in generation \" + str(generation) + \".\")\n            return MASTER_KEY, generation\n        new_population = []\n        while len(new_population) < POPULATION_SIZE:\n            parent1 = selection(population)\n            parent2 = selection(population)\n            child1, child2 = crossover(parent1, parent2)\n            new_population.append(mutation(child1))\n            new_population.append(mutation(child2))\n        population = new_population[:POPULATION_SIZE]\n    best = max(population, key=fitness)\n    print(\"Not found. Best: \" + best + \" (fitness \" + str(fitness(best)) + \")\")\n    return best, MAX_GENERATIONS\n\nrandom.seed(1)\ngenetic_algorithm()\n", "expected": "Vault unlocked! Master Key 1111111111 found in generation N.", "tests": "\ndef check(ns, ref):\n    f = ns['selection']\n    pop = [\"0000000000\", \"1111111111\", \"1010101010\", \"0101010101\"]\n    seen = set()\n    for _ in range(300):\n        c = f(pop); assert c in pop, \"selection must return a member of the population, got %r\" % c\n        seen.add(c)\n    assert len(seen) == 4, \"Over 300 calls every member should be picked at least once (got %r) — is it really random?\" % seen\n    assert f([\"x\"]) == \"x\"\n", "hint": "One line: chromosome = random.choice(population). Do NOT use max(..., key=fitness) — the paper says \"without looking at fitness\".", "notes": "The paper literally leaves \"return chromosome\" in place so a blank answer crashes with NameError. Read what the stub expects you to produce.", "viva": []}, {"id": "l2_tournament", "lab": 2, "tag": "HIGH PROBABILITY", "title": "Tournament selection", "summary": "Every GA assignment ends with \"research tournament selection — might be helpful in the near future\". Pick k random individuals, return the fittest of them.", "prelude": "import random\n\ndef fitness(chromosome):\n    return chromosome.count(\"1\")\n", "stub": "def tournament_selection(population, k=2):\n    \"\"\"Pick k distinct individuals at random; return the one with the highest fitness.\"\"\"\n    # TODO\n    pass\n", "solution": "def tournament_selection(population, k=2):\n    \"\"\"Pick k distinct individuals at random; return the one with the highest fitness.\"\"\"\n    contestants = random.sample(population, k)\n    best = contestants[0]\n    for c in contestants[1:]:\n        if fitness(c) > fitness(best):\n            best = c\n    return best\n", "postlude": "\nrandom.seed(4)\npop = [\"0000\", \"1100\", \"1110\", \"1111\"]\nprint(tournament_selection(pop, 2))\n", "expected": "one of the four strings (whichever wins the random tournament)", "tests": "\ndef check(ns, ref):\n    import random\n    f = ns['tournament_selection']\n    pop = [\"0000\", \"1100\", \"1110\", \"1111\"]\n    for _ in range(200):\n        assert f(pop, 2) in pop\n    assert f(pop, 4) == \"1111\", \"With k = population size the fittest must always win\"\n    for _ in range(100):\n        assert f(pop, 4) == \"1111\"\n    # with k=2 the weakest can never win\n    for _ in range(300):\n        assert f(pop, 2) != \"0000\", \"'0000' can never win a 2-way tournament (it loses to anything)\"\n    # picks must be distinct: with k=2 on a 2-member population, the better one always returns\n    for _ in range(50):\n        assert f([\"0001\", \"0111\"], 2) == \"0111\"\n", "hint": "random.sample(population, k) gives k distinct contestants; return max(contestants, key=fitness).", "notes": "Selection pressure grows with k. k = population size makes it pure elitism; k = 1 makes it random selection. Also know ROULETTE WHEEL: probability ∝ fitness, e.g. random.choices(population, weights=[fitness(c) for c in population], k=1)[0].", "viva": ["Why is tournament selection better than random selection? (Fitter parents are chosen more often, so the population improves faster; still keeps diversity.)", "What does k control? (Selection pressure.)"]}, {"id": "l2_single_point", "lab": 2, "tag": "ASSIGNMENT CORE", "title": "Single-point crossover", "summary": "Cut both parents at the same random point (1 … len−1) and swap the tails. Return both children and the cut point.", "prelude": "import random\n", "stub": "def single_point_crossover(p1, p2):\n    \"\"\"Return (child1, child2, point). point is chosen with random.randint(1, len(p1) - 1).\"\"\"\n    # TODO\n    pass\n", "solution": "def single_point_crossover(p1, p2):\n    \"\"\"Return (child1, child2, point). point is chosen with random.randint(1, len(p1) - 1).\"\"\"\n    point = random.randint(1, len(p1) - 1)\n    child1 = p1[:point] + p2[point:]\n    child2 = p2[:point] + p1[point:]\n    return child1, child2, point\n", "postlude": "\nrandom.seed(2)\nprint(single_point_crossover(\"110011\", \"101010\"))\n", "expected": "('110010', '101011', 3)   (the point depends on the seed)", "tests": "\ndef check(ns, ref):\n    import random\n    f = ns['single_point_crossover']\n    for _ in range(100):\n        c1, c2, pt = f(\"110011\", \"101010\")\n        assert 1 <= pt <= 5, \"point must be in 1..len-1, got %r\" % pt\n        assert c1 == \"110011\"[:pt] + \"101010\"[pt:], \"child1 = p1[:point] + p2[point:]\"\n        assert c2 == \"101010\"[:pt] + \"110011\"[pt:], \"child2 = p2[:point] + p1[point:]\"\n    # must be able to return any cut point\n    pts = set(f(\"00000000\", \"11111111\")[2] for _ in range(300))\n    assert pts == set(range(1, 8)), \"All cut points 1..7 should be possible, saw %r\" % sorted(pts)\n", "hint": "point = random.randint(1, len(p1) - 1); child1 = p1[:point] + p2[point:]; child2 = p2[:point] + p1[point:].", "notes": "Works on strings AND lists (slicing is the same). For permutation problems (TSP, N-queens) this breaks validity — use order crossover there.", "viva": []}, {"id": "l2_two_point", "lab": 2, "tag": "ASSIGNMENT CORE", "title": "Two-point crossover (Part 2 of every GA assignment)", "summary": "Choose two cut points with the second strictly after the first; swap the middle segment.", "prelude": "import random\n", "stub": "def two_point_crossover(p1, p2):\n    \"\"\"Return (child1, child2, pt1, pt2) with 1 <= pt1 < pt2 <= len(p1) - 1.\n    The segment [pt1:pt2] is swapped between the parents.\"\"\"\n    # TODO\n    pass\n", "solution": "def two_point_crossover(p1, p2):\n    \"\"\"Return (child1, child2, pt1, pt2) with 1 <= pt1 < pt2 <= len(p1) - 1.\n    The segment [pt1:pt2] is swapped between the parents.\"\"\"\n    pt1 = random.randint(1, len(p1) - 2)\n    pt2 = random.randint(pt1 + 1, len(p1) - 1)\n    child1 = p1[:pt1] + p2[pt1:pt2] + p1[pt2:]\n    child2 = p2[:pt1] + p1[pt1:pt2] + p2[pt2:]\n    return child1, child2, pt1, pt2\n", "postlude": "\nrandom.seed(3)\nprint(two_point_crossover(\"000111000\", \"111000111\"))\n", "expected": "e.g. ('000000100', '111111011', 3, 7) for points 3 and 7 — the assignment's own example", "tests": "\ndef check(ns, ref):\n    f = ns['two_point_crossover']\n    for _ in range(200):\n        c1, c2, a, b = f(\"000111000\", \"111000111\")\n        assert 1 <= a < b <= 8, \"Need 1 <= pt1 < pt2 <= len-1, got %r %r\" % (a, b)\n        assert c1 == \"000111000\"[:a] + \"111000111\"[a:b] + \"000111000\"[b:], \"child1 = p1[:pt1] + p2[pt1:pt2] + p1[pt2:]\"\n        assert c2 == \"111000111\"[:a] + \"000111000\"[a:b] + \"111000111\"[b:], \"child2 = p2[:pt1] + p1[pt1:pt2] + p2[pt2:]\"\n    pairs = set(f(\"0000000000\", \"1111111111\")[2:] for _ in range(600))\n    assert len(pairs) >= 20, \"Cut points do not look random enough (saw only %d distinct pairs)\" % len(pairs)\n", "hint": "pt1 = random.randint(1, len-2); pt2 = random.randint(pt1 + 1, len-1). Then three slices per child.", "notes": "The assignment example: parents 000111000 / 111000111, points after index 2 and after index 6 → children 000000100 and 111111011. \"Second point after the first\" is the thing they mark.", "viva": []}, {"id": "l2_mutation", "lab": 2, "tag": "ASSIGNMENT CORE", "title": "Bit-flip mutation with a rate", "summary": "Every bit flips independently with probability rate. Return the new string.", "prelude": "import random\n", "stub": "def mutation(chromosome, rate):\n    \"\"\"Each bit has a `rate` chance of being flipped (0 -> 1, 1 -> 0).\"\"\"\n    # TODO\n    pass\n", "solution": "def mutation(chromosome, rate):\n    \"\"\"Each bit has a `rate` chance of being flipped (0 -> 1, 1 -> 0).\"\"\"\n    new_chromosome = \"\"\n    for bit in chromosome:\n        if random.random() < rate:\n            new_chromosome += \"1\" if bit == \"0\" else \"0\"\n        else:\n            new_chromosome += bit\n    return new_chromosome\n", "postlude": "\nrandom.seed(5)\nprint(mutation(\"0000000000\", 0.3))\n", "expected": "a 10-bit string with roughly 3 ones (depends on the seed)", "tests": "\ndef check(ns, ref):\n    f = ns['mutation']\n    assert f(\"0101\", 0.0) == \"0101\", \"rate 0 must change nothing\"\n    assert f(\"0101\", 1.0) == \"1010\", \"rate 1 must flip every bit\"\n    for _ in range(50):\n        out = f(\"0011001100\", 0.3)\n        assert isinstance(out, str) and len(out) == 10 and set(out) <= set(\"01\"), \"Must return a 10-char 0/1 string, got %r\" % out\n    flips = 0\n    for _ in range(500):\n        out = f(\"0000000000\", 0.1)\n        flips += out.count(\"1\")\n    assert 300 <= flips <= 700, \"With rate 0.1 on 5000 bits expect about 500 flips, got %d — flip each bit independently\" % flips\n", "hint": "Loop over the bits; if random.random() < rate append the flipped bit, else append the original.", "notes": "Variants: mutate exactly ONE random position (pos = random.randrange(len); flip it); for integer/coordinate genes, replace with random.randint(lo, hi) instead of flipping. Never forget: strings are immutable — build a new one or convert to a list.", "viva": []}, {"id": "l2_next_gen", "lab": 2, "tag": "ASSIGNMENT CORE", "title": "Next generation with elitism", "summary": "Keep the best individual, then fill the rest of the population with mutated children of selected parents. Population size must stay constant.", "prelude": "import random\n\nPOPULATION_SIZE = 4\nMUTATION_RATE = 0.1\n\ndef fitness(c):\n    return c.count(\"1\")\n\ndef selection(population):\n    return random.choice(population)\n\ndef crossover(p1, p2):\n    point = random.randint(1, len(p1) - 1)\n    return p1[:point] + p2[point:], p2[:point] + p1[point:]\n\ndef mutation(c, rate=MUTATION_RATE):\n    return \"\".join((\"1\" if b == \"0\" else \"0\") if random.random() < rate else b for b in c)\n", "stub": "def next_generation(population):\n    \"\"\"Elitism: carry the single fittest individual forward unchanged.\n    Fill the remaining slots with mutated children (crossover of two selected parents).\n    Return a list of exactly POPULATION_SIZE chromosomes.\"\"\"\n    # TODO\n    pass\n", "solution": "def next_generation(population):\n    \"\"\"Elitism: carry the single fittest individual forward unchanged.\n    Fill the remaining slots with mutated children (crossover of two selected parents).\n    Return a list of exactly POPULATION_SIZE chromosomes.\"\"\"\n    best = max(population, key=fitness)\n    new_pop = [best]\n    while len(new_pop) < POPULATION_SIZE:\n        p1 = selection(population)\n        p2 = selection(population)\n        c1, c2 = crossover(p1, p2)\n        new_pop.append(mutation(c1))\n        if len(new_pop) < POPULATION_SIZE:\n            new_pop.append(mutation(c2))\n    return new_pop\n", "postlude": "\nrandom.seed(6)\nprint(next_generation([\"0000\", \"1100\", \"1110\", \"0011\"]))\n", "expected": "a list of 4 strings whose first element is '1110'", "tests": "\ndef check(ns, ref):\n    f = ns['next_generation']\n    pop = [\"0000\", \"1100\", \"1110\", \"0011\"]\n    for _ in range(100):\n        out = f(pop)\n        assert isinstance(out, list) and len(out) == 4, \"Must return exactly POPULATION_SIZE = 4 individuals, got %r\" % (out,)\n        assert \"1110\" in out, \"Elitism: the fittest ('1110') must survive unchanged\"\n        for c in out:\n            assert isinstance(c, str) and len(c) == 4 and set(c) <= set(\"01\")\n    ns['POPULATION_SIZE'] = 7\n    for _ in range(30):\n        assert len(f(pop)) == 7, \"Must respect POPULATION_SIZE (now 7)\"\n    ns['POPULATION_SIZE'] = 4\n", "hint": "best = max(population, key=fitness); new_pop = [best]; while len(new_pop) < POPULATION_SIZE: select two parents, crossover, append mutation(c1) and — only if there is still room — mutation(c2).", "notes": "The \"if there is still room\" check is what keeps the size exact when it is even/odd. Tweak: 2-elitism (take the top two: sorted(population, key=fitness, reverse=True)[:2]).", "viva": ["What is elitism and why use it? (Best solution can never get lost; guarantees monotone best-fitness.)"]}, {"id": "l2_schedule_fitness", "lab": 2, "tag": "TWEAK", "title": "Fitness with penalties (course-scheduling GA)", "summary": "From the Summer-24 assignment. Chromosome = T segments of N bits. fitness = −(overlap penalty + consistency penalty).", "prelude": "# N courses, T timeslots. Chromosome length N*T. Segment t (bits t*N .. t*N+N-1) = timeslot t,\n# bit i inside a segment = whether course i is scheduled in that slot.\n", "stub": "def fitness(chromosome, N, T):\n    \"\"\"overlap penalty: for each timeslot, (#courses scheduled - 1) if more than one is scheduled.\n    consistency penalty: for each course, 1 if it is not scheduled exactly once.\n    Return -(overlap + consistency).\"\"\"\n    # TODO\n    pass\n", "solution": "def fitness(chromosome, N, T):\n    \"\"\"overlap penalty: for each timeslot, (#courses scheduled - 1) if more than one is scheduled.\n    consistency penalty: for each course, 1 if it is not scheduled exactly once.\n    Return -(overlap + consistency).\"\"\"\n    overlap = 0\n    for t in range(T):\n        segment = chromosome[t * N:(t + 1) * N]\n        scheduled = segment.count(\"1\")\n        if scheduled > 1:\n            overlap += scheduled - 1\n    consistency = 0\n    for i in range(N):\n        times = sum(1 for t in range(T) if chromosome[t * N + i] == \"1\")\n        if times != 1:\n            consistency += 1\n    return -(overlap + consistency)\n", "postlude": "\nprint(fitness(\"110110010\", 3, 3))\nprint(fitness(\"100010001\", 3, 3))\n", "expected": "-5\n0", "tests": "\ndef check(ns, ref):\n    f = ns['fitness']\n    assert f(\"100010001\", 3, 3) == 0, \"A perfect schedule has fitness 0\"\n    assert f(\"110110010\", 3, 3) == -5, \"110110010: overlap 1+1+0=2, consistency 3 (CSE110 x2, MAT110 x2, PHY112 x1 -> 2 bad) ... expected -5\"\n    assert f(\"000000000\", 3, 3) == -3\n    assert f(\"111111111\", 3, 3) == -(2+2+2) - 3\n    import random\n    rnd = random.Random(8)\n    for _ in range(40):\n        N, T = rnd.randint(1, 4), rnd.randint(1, 5)\n        c = \"\".join(rnd.choice(\"01\") for _ in range(N*T))\n        assert f(c, N, T) == ref['fitness'](c, N, T), \"Mismatch for %r N=%d T=%d\" % (c, N, T)\n", "hint": "Slice the segment for timeslot t with chromosome[t*N:(t+1)*N]. Course i in slot t is at index t*N + i.", "notes": "The Summer-24 paper prints −6 for 110110010 using its own counting; the definition above (extra courses per slot + one per bad course) gives −5. In the exam, follow whatever the given fitness description says — the skill being tested is indexing into segments.", "viva": []}, {"id": "l3_minimax", "lab": 3, "tag": "ASSIGNMENT CORE", "title": "Plain minimax on an implicit binary tree", "summary": "Leaves are given in a list; node (depth, index) has children 2*index and 2*index+1 one level down. Return the root value.", "prelude": "# leaves: list of 2**depth utility values, left to right\n", "stub": "def minimax(depth, index, is_max, leaves):\n    \"\"\"Value of the node at (depth levels above the leaves, index among its level).\n    depth == 0 means the node is leaves[index].\"\"\"\n    # TODO\n    pass\n", "solution": "def minimax(depth, index, is_max, leaves):\n    \"\"\"Value of the node at (depth levels above the leaves, index among its level).\n    depth == 0 means the node is leaves[index].\"\"\"\n    if depth == 0:\n        return leaves[index]\n    left = minimax(depth - 1, 2 * index, not is_max, leaves)\n    right = minimax(depth - 1, 2 * index + 1, not is_max, leaves)\n    if is_max:\n        return max(left, right)\n    else:\n        return min(left, right)\n", "postlude": "\nprint(minimax(3, 0, True, [3, 6, 2, 3, 7, 1, 2, 0]))   # Pacman tree from Lab 3\nprint(minimax(2, 0, True, [3, 5, 2, 9]))\n", "expected": "3\n3", "tests": "\ndef check(ns, ref):\n    import random\n    f = ns['minimax']\n    assert f(3, 0, True, [3, 6, 2, 3, 7, 1, 2, 0]) == 3, \"Pacman tree (MAX root) should be 3\"\n    assert f(3, 0, False, [3, 6, 2, 3, 7, 1, 2, 0]) == ref['minimax'](3, 0, False, [3, 6, 2, 3, 7, 1, 2, 0]), \"MIN root\"\n    assert f(0, 2, True, [4, 5, 6]) == 6, \"depth 0 returns leaves[index]\"\n    rnd = random.Random(12)\n    for _ in range(60):\n        d = rnd.randint(1, 5); L = [rnd.randint(-9, 9) for _ in range(2 ** d)]; m = rnd.random() < 0.5\n        assert f(d, 0, m, L) == ref['minimax'](d, 0, m, L), \"Mismatch depth %d root %s leaves %r\" % (d, 'MAX' if m else 'MIN', L)\n", "hint": "Base case depth == 0 → leaves[index]. Recurse on children 2*index and 2*index+1 with depth−1 and the player flipped; combine with max or min.", "notes": "This \"implicit tree\" trick (no node objects, just an index) is how the Mortal Kombat solution works too (branching 2, depth 5, 32 leaves).", "viva": []}, {"id": "l3_ab_max", "lab": 3, "tag": "ASSIGNMENT CORE", "title": "Alpha-beta: the MAX branch", "summary": "Fill in what a MAX node does: loop over its two children, keep the best, raise alpha, stop when alpha ≥ beta.", "prelude": "import math\n\ndef alpha_beta(depth, index, is_max, leaves, alpha, beta):\n    \"\"\"Alpha-beta on an implicit binary tree. Returns the node value.\"\"\"\n    if depth == 0:\n        return leaves[index]\n", "stub": "    if is_max:\n        # TODO: best = -inf; for each child (2*index, 2*index+1):\n        #   value = alpha_beta(child...), best = max(best, value), alpha = max(alpha, best)\n        #   if beta <= alpha: break   (prune)\n        # return best\n        pass\n    else:\n        best = math.inf\n        for i in range(2):\n            value = alpha_beta(depth - 1, 2 * index + i, True, leaves, alpha, beta)\n            best = min(best, value)\n            beta = min(beta, best)\n            if beta <= alpha:\n                break\n        return best\n", "solution": "    if is_max:\n        best = -math.inf\n        for i in range(2):\n            value = alpha_beta(depth - 1, 2 * index + i, False, leaves, alpha, beta)\n            best = max(best, value)\n            alpha = max(alpha, best)\n            if beta <= alpha:\n                break\n        return best\n    else:\n        best = math.inf\n        for i in range(2):\n            value = alpha_beta(depth - 1, 2 * index + i, True, leaves, alpha, beta)\n            best = min(best, value)\n            beta = min(beta, best)\n            if beta <= alpha:\n                break\n        return best\n", "postlude": "\nprint(alpha_beta(3, 0, True, [3, 6, 2, 3, 7, 1, 2, 0], -math.inf, math.inf))\nprint(alpha_beta(4, 0, True, [8,4,2,7,4,5,3,2,5,1,2,4,6,3,5,7], -math.inf, math.inf))   # Assignment Q17 tree\n", "expected": "3\n4", "tests": "\ndef check(ns, ref):\n    import random, math\n    f = ns['alpha_beta']\n    assert f(3, 0, True, [3, 6, 2, 3, 7, 1, 2, 0], -math.inf, math.inf) == 3\n    assert f(4, 0, True, [8,4,2,7,4,5,3,2,5,1,2,4,6,3,5,7], -math.inf, math.inf) == 4, \"Assignment Q17 tree must give 4\"\n    rnd = random.Random(13)\n    for _ in range(80):\n        d = rnd.randint(1, 6); L = [rnd.randint(-9, 9) for _ in range(2 ** d)]; m = rnd.random() < 0.5\n        assert f(d, 0, m, L, -math.inf, math.inf) == ref['alpha_beta'](d, 0, m, L, -math.inf, math.inf), \"Mismatch depth %d root %s leaves %r\" % (d, 'MAX' if m else 'MIN', L)\n    # pruning must actually happen: count leaf visits via a tracing list\n    class Tracer(list):\n        def __getitem__(self, i):\n            visits.append(i); return list.__getitem__(self, i)\n    visits = []\n    f(4, 0, True, Tracer([8,4,2,7,4,5,3,2,5,1,2,4,6,3,5,7]), -math.inf, math.inf)\n    assert len(visits) == 8, \"Alpha-beta on the Q17 tree should look at exactly 8 of 16 leaves, you looked at %d — are you pruning (break when beta <= alpha)?\" % len(visits)\n", "hint": "Mirror the MIN branch: -math.inf, max(), alpha = max(alpha, best), and the same \"if beta <= alpha: break\".", "notes": "The Q17 tree from the theory assignment: alpha-beta examines 8 of 16 leaves and still returns 4. The test checks that you really prune.", "viva": ["What do alpha and beta mean? (alpha = best value MAX can already guarantee on this path; beta = best value MIN can guarantee.)", "Does pruning change the answer? (Never. Same root value as plain minimax, fewer leaves examined.)"]}, {"id": "l3_ab_full", "lab": 3, "tag": "HARD", "title": "Write the whole alpha-beta function (with pruned-count)", "summary": "Return (value, number_of_branches_pruned). Used in the Mortal Kombat solution.", "prelude": "import math\n", "stub": "def alpha_beta(depth, index, is_max, leaves, alpha, beta):\n    \"\"\"Return (value, pruned) where pruned counts every child branch that was skipped.\"\"\"\n    # TODO: whole function\n    pass\n", "solution": "def alpha_beta(depth, index, is_max, leaves, alpha, beta):\n    \"\"\"Return (value, pruned) where pruned counts every child branch that was skipped.\"\"\"\n    if depth == 0:\n        return leaves[index], 0\n    pruned = 0\n    if is_max:\n        best = -math.inf\n        for i in range(2):\n            value, p = alpha_beta(depth - 1, 2 * index + i, False, leaves, alpha, beta)\n            pruned += p\n            best = max(best, value)\n            alpha = max(alpha, best)\n            if beta <= alpha:\n                pruned += 2 - i - 1\n                break\n    else:\n        best = math.inf\n        for i in range(2):\n            value, p = alpha_beta(depth - 1, 2 * index + i, True, leaves, alpha, beta)\n            pruned += p\n            best = min(best, value)\n            beta = min(beta, best)\n            if beta <= alpha:\n                pruned += 2 - i - 1\n                break\n    return best, pruned\n", "postlude": "\nprint(alpha_beta(3, 0, True, [3, 6, 2, 3, 7, 1, 2, 0], -math.inf, math.inf))\n", "expected": "(3, 0)", "tests": "\ndef check(ns, ref):\n    import random, math\n    f = ns['alpha_beta']\n    assert f(3, 0, True, [3, 6, 2, 3, 7, 1, 2, 0], -math.inf, math.inf) == (3, 0), \"Pacman tree: value 3 and NOTHING pruned — the cut condition only becomes true at the right ghost's LAST child, so no sibling is skipped\"\n    assert f(2, 0, True, [3, 5, 2, 9], -math.inf, math.inf) == (3, 1), \"Leaves [3,5,2,9]: left MIN = 3, right MIN sees 2 <= alpha 3 and skips the 9 -> (3, 1)\"\n    assert f(4, 0, True, [8,4,2,7,4,5,3,2,5,1,2,4,6,3,5,7], -math.inf, math.inf)[0] == 4\n    rnd = random.Random(14)\n    for _ in range(80):\n        d = rnd.randint(1, 6); L = [rnd.randint(-9, 9) for _ in range(2 ** d)]; m = rnd.random() < 0.5\n        a = f(d, 0, m, L, -math.inf, math.inf); b = ref['alpha_beta'](d, 0, m, L, -math.inf, math.inf)\n        assert a[0] == b[0], \"Wrong value for depth %d root %s leaves %r: yours %r expected %r\" % (d, 'MAX' if m else 'MIN', L, a, b)\n        assert a[1] == b[1], \"Wrong pruned count for depth %d leaves %r: yours %r expected %r (count the skipped siblings at each cut)\" % (d, L, a[1], b[1])\n", "hint": "Base case returns (leaves[index], 0). Each branch accumulates the children's pruned counts; on a cut add the number of siblings not visited (2 - i - 1).", "notes": "With branching factor b the skipped-sibling count is b - i - 1 — the repo solution is written for general BRANCHING. Viva trap: on the Pacman tree the condition beta <= alpha becomes true at the right ghost's second (last) child, so the printed \"PRUNE\" skips nothing — pruned count is 0. On [3, 5, 2, 9] the right MIN node sees 2 <= 3 after its FIRST child and really skips the 9.", "viva": []}, {"id": "l3_mk_rounds", "lab": 3, "tag": "ASSIGNMENT CORE", "title": "Mortal Kombat: the best-of-3 round loop", "summary": "Alternate who starts each round; Sub-Zero starting ⇒ MAX root; utility +1 = Sub-Zero wins, −1 = Scorpion. First to two round wins takes the game.", "prelude": "import random, math\n\nDEPTH = 5\n\ndef alpha_beta(depth, index, is_max, leaves, alpha, beta):\n    if depth == 0:\n        return leaves[index]\n    if is_max:\n        best = -math.inf\n        for i in range(2):\n            best = max(best, alpha_beta(depth - 1, 2 * index + i, False, leaves, alpha, beta))\n            alpha = max(alpha, best)\n            if beta <= alpha: break\n        return best\n    best = math.inf\n    for i in range(2):\n        best = min(best, alpha_beta(depth - 1, 2 * index + i, True, leaves, alpha, beta))\n        beta = min(beta, best)\n        if beta <= alpha: break\n    return best\n\ndef generate_leaves():\n    return [random.choice([-1, 1]) for _ in range(2 ** DEPTH)]\n", "stub": "def mortal_kombat(first_player):\n    \"\"\"first_player: 0 = Scorpion starts, 1 = Sub-Zero starts.\n    Returns (game_winner, round_winners_list).\n    Each round: new random leaves; root is MAX iff Sub-Zero starts; +1 => 'Sub-Zero', -1 => 'Scorpion'.\n    The player who did NOT start the previous round starts the next. Stop when someone has 2 round wins.\"\"\"\n    # TODO\n    pass\n", "solution": "def mortal_kombat(first_player):\n    \"\"\"first_player: 0 = Scorpion starts, 1 = Sub-Zero starts.\n    Returns (game_winner, round_winners_list).\n    Each round: new random leaves; root is MAX iff Sub-Zero starts; +1 => 'Sub-Zero', -1 => 'Scorpion'.\n    The player who did NOT start the previous round starts the next. Stop when someone has 2 round wins.\"\"\"\n    scorpion_wins = 0\n    subzero_wins = 0\n    round_winners = []\n    current_first = first_player\n    while scorpion_wins < 2 and subzero_wins < 2:\n        leaves = generate_leaves()\n        is_max = (current_first == 1)\n        value = alpha_beta(DEPTH, 0, is_max, leaves, -math.inf, math.inf)\n        winner = \"Sub-Zero\" if value == 1 else \"Scorpion\"\n        round_winners.append(winner)\n        if winner == \"Scorpion\":\n            scorpion_wins += 1\n        else:\n            subzero_wins += 1\n        current_first = 1 - current_first\n    game_winner = \"Scorpion\" if scorpion_wins == 2 else \"Sub-Zero\"\n    return game_winner, round_winners\n", "postlude": "\nrandom.seed(7)\nwinner, rounds = mortal_kombat(0)\nprint(\"Game Winner:\", winner)\nprint(\"Total Rounds Played:\", len(rounds))\nfor i, w in enumerate(rounds, 1):\n    print(\"Winner of Round \" + str(i) + \":\", w)\n", "expected": "Game Winner: <name>\nTotal Rounds Played: 2 or 3\nWinner of Round 1: ...   (depends on the random leaves)", "tests": "\ndef check(ns, ref):\n    import random\n    f = ns['mortal_kombat']\n    for seed in range(40):\n        for fp in (0, 1):\n            random.seed(seed); a = f(fp)\n            random.seed(seed); b = ref['mortal_kombat'](fp)\n            assert a == b, \"seed %d first_player %d: yours %r expected %r\" % (seed, fp, a, b)\n            w, rs = a\n            assert len(rs) in (2, 3) and rs.count(w) == 2, \"Game must stop as soon as someone has 2 round wins\"\n", "hint": "Loop while both win-counts are < 2. is_max = (current_first == 1). After each round: current_first = 1 - current_first.", "notes": "Marks are usually lost on (a) forgetting to alternate the starter, (b) playing exactly 3 rounds instead of stopping at 2 wins, (c) mapping +1/−1 to the wrong fighter.", "viva": []}, {"id": "l3_pacman", "lab": 3, "tag": "ASSIGNMENT CORE", "title": "Pacman dark magic decision", "summary": "Given the fixed 8-leaf tree, compute the normal minimax value and the value of using magic on the left or right ghost (max of that subtree minus cost c). Decide.", "prelude": "LEAVES = [3, 6, 2, 3, 7, 1, 2, 0]\n", "stub": "def pacman_game(c):\n    \"\"\"Return (normal_value, best_magic_value, direction, use_magic)\n    where direction is 'left' or 'right' (prefer right on a tie) and use_magic is True\n    only if best_magic_value > normal_value.\"\"\"\n    # TODO\n    pass\n", "solution": "def pacman_game(c):\n    \"\"\"Return (normal_value, best_magic_value, direction, use_magic)\n    where direction is 'left' or 'right' (prefer right on a tie) and use_magic is True\n    only if best_magic_value > normal_value.\"\"\"\n    L = LEAVES\n    pm = [max(L[0], L[1]), max(L[2], L[3]), max(L[4], L[5]), max(L[6], L[7])]\n    ghost_left = min(pm[0], pm[1])\n    ghost_right = min(pm[2], pm[3])\n    normal_value = max(ghost_left, ghost_right)\n    magic_left = max(pm[0], pm[1]) - c\n    magic_right = max(pm[2], pm[3]) - c\n    if magic_right >= magic_left:\n        best, direction = magic_right, \"right\"\n    else:\n        best, direction = magic_left, \"left\"\n    return normal_value, best, direction, best > normal_value\n", "postlude": "\nfor c in (2, 5):\n    normal, magic, side, use = pacman_game(c)\n    if use:\n        print(\"The new minimax value is \" + str(magic) + \". Pacman goes \" + side + \" and uses dark magic\")\n    else:\n        print(\"The minimax value is \" + str(normal) + \". Pacman does not use dark magic\")\n", "expected": "The new minimax value is 5. Pacman goes right and uses dark magic\nThe minimax value is 3. Pacman does not use dark magic", "tests": "\ndef check(ns, ref):\n    f = ns['pacman_game']\n    assert f(2) == (3, 5, 'right', True), \"c=2: normal 3, magic right 7-2=5 -> use magic, got %r\" % (f(2),)\n    assert f(5) == (3, 2, 'right', False), \"c=5: magic gives 2 < 3 -> no magic\"\n    assert f(0) == (3, 7, 'right', True)\n    assert f(4)[3] == False, \"c=4: 7-4=3 is NOT better than 3 (must be strictly greater)\"\n    ns['LEAVES'] = [9, 1, 2, 2, 1, 1, 2, 2]\n    r = f(1)\n    assert r == (2, 8, 'left', True), \"With leaves [9,1,2,2,1,1,2,2] and c=1 expected (2, 8, 'left', True), got %r\" % (r,)\n    ns['LEAVES'] = [3, 6, 2, 3, 7, 1, 2, 0]\n", "hint": "pm = four max() of leaf pairs; ghosts = two min(); normal = max of ghosts; magic side = max of that ghost's two pm values minus c.", "notes": "The hint in the assignment: root = 3; magic left = 6−c, magic right = 7−c. Magic is used only when strictly better.", "viva": []}, {"id": "l3_gene_utility", "lab": 3, "tag": "THIS SEMESTER", "title": "Gene-sequence utility function", "summary": "From this semester's Lab 3. utility = −Σ wᵢ · |ASCII(gene[i]) − ASCII(target[i])| over max(len) positions; missing chars count as 0, missing weights as 1.", "prelude": "# weights: a list of ints (last n digits of the student ID, n = len(target))\n", "stub": "def utility(gene, target, weights):\n    # TODO\n    pass\n", "solution": "def utility(gene, target, weights):\n    N = max(len(gene), len(target))\n    total = 0\n    for i in range(N):\n        w = weights[i] if i < len(weights) else 1\n        a = ord(gene[i]) if i < len(gene) else 0\n        b = ord(target[i]) if i < len(target) else 0\n        total -= w * abs(a - b)\n    return total\n", "postlude": "\nprint(utility(\"ATGC\", \"ATGC\", [4, 0, 5, 2]))\nprint(utility(\"AGCT\", \"ATGC\", [4, 0, 5, 2]))\nprint(utility(\"AGCTS\", \"ATGC\", [4, 0, 5, 2]))\n", "expected": "0\n-54\n-137", "tests": "\ndef check(ns, ref):\n    f = ns['utility']\n    assert f(\"ATGC\", \"ATGC\", [4, 0, 5, 2]) == 0\n    assert f(\"AGCT\", \"ATGC\", [4, 0, 5, 2]) == -54, \"Sample from the assignment: AGCT vs ATGC with weights [4,0,5,2] = -54\"\n    assert f(\"AGCTS\", \"ATGC\", [4, 0, 5, 2]) == -137, \"Extra char S: weight 1 * |83 - 0| = 83 more penalty -> -137\"\n    assert f(\"\", \"AT\", [1, 1]) == -(65 + 84)\n    import random\n    rnd = random.Random(15)\n    for _ in range(50):\n        g = \"\".join(rnd.choice(\"ATCGS\") for _ in range(rnd.randint(0, 6)))\n        t = \"\".join(rnd.choice(\"ATCG\") for _ in range(rnd.randint(1, 5)))\n        w = [rnd.randint(0, 9) for _ in range(len(t))]\n        assert f(g, t, w) == ref['utility'](g, t, w), \"Mismatch for %r %r %r\" % (g, t, w)\n", "hint": "N = max(len(gene), len(target)); for i in range(N): w = weights[i] if i < len(weights) else 1; chars out of range contribute ord 0.", "notes": "ord(\"A\")=65, ord(\"T\")=84, ord(\"C\")=67, ord(\"G\")=71, ord(\"S\")=83. The assignment's sample 1 answer (−54) is this function applied to AGCT.", "viva": []}, {"id": "l3_gene_minimax", "lab": 3, "tag": "THIS SEMESTER", "title": "Minimax over a shrinking pool (gene game)", "summary": "Agents alternately take a nucleotide from the pool and append it to the sequence. MAX wants high utility, MIN wants low. Return (best_utility, best_sequence) for the player to move.", "prelude": "def utility(gene, target, weights):\n    N = max(len(gene), len(target))\n    total = 0\n    for i in range(N):\n        w = weights[i] if i < len(weights) else 1\n        a = ord(gene[i]) if i < len(gene) else 0\n        b = ord(target[i]) if i < len(target) else 0\n        total -= w * abs(a - b)\n    return total\n", "stub": "def minimax(pool, gene, is_max, target, weights):\n    \"\"\"pool: list of remaining nucleotides; gene: sequence built so far.\n    Terminal when the pool is empty: return (utility, gene).\n    Otherwise try every nucleotide in the pool (remove it, append it, recurse with the other player)\n    and return the (value, se ion; in Mortal Kombat Scorpion is MIN even when he moves first. What matters is whose utility we maximise."], ["Can alpha-beta handle chance (dice, random drops)?", "Not directly — you need expectiminimax with chance nodes; pruning there is much weaker because a chance node needs all children."], ["How would you explain your fitness function?", "State what is rewarded, what is penalised, and the direction (maximise/minimise). For the vault: matching bits. For scheduling: minus the overlap and consistency penalties. For VLSI: −(1000·overlaps + 2·wiring + area)."]], "labintro": {"1": {"title": "Lab 1 — A* search (and its siblings)", "text": "Two of the three real assessment papers are from this lab: the A* neighbour-expansion blank and the greedy best-first blank, both on a 5-node graph given as an adjacency list. The drills below start with those two exactly as set, then cover the maze version from the assignment, the admissibility checker, and the tweaks an examiner can make (UCS, consistency, Euclidean, diagonal moves)."}, "2": {"title": "Lab 2 — Genetic algorithm", "text": "The Fall-26 assessment blanked three tiny functions of a 10-bit \"vault\" GA: create_population, fitness and selection. Every GA assignment also ends with two-point crossover as Part 2 and a hint to learn tournament selection. Drills follow that order: the three real blanks, tournament, single/two-point crossover, mutation, next generation with elitism, and a penalty-style fitness."}, "3": {"title": "Lab 3 — Adversarial search", "text": "No assessment paper for Lab 3 was shared, so these drills are cut from the assignments: minimax and alpha-beta on an implicit binary tree (the Mortal Kombat / chess structure), the round loop, the Pacman dark-magic decision, and this semester's gene-sequence game (utility function + minimax over a shrinking pool). Expect a MIN-at-the-root tweak."}}};

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(src){
  // tiny Python highlighter: comments, strings, keywords, numbers, defs
  const KW = /\b(def|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|import|from|as|class|pass|break|continue|try|except|finally|raise|with|lambda|yield|global|assert|del)\b/g;
  let out = '', i = 0, s = src;
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')/g;
  let m;
  while((m = re.exec(s))){
    out += plain(s.slice(i, m.index));
    if(m[1]) out += '<span class="pyc">'+esc(m[1])+'</span>'; else out += '<span class="pys">'+esc(m[2])+'</span>';
    i = m.index + m[0].length;
  }
  out += plain(s.slice(i));
  return out;
  function plain(t){
    return esc(t).replace(KW, '<span class="pyk">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="pyn">$1</span>').replace(/\b(def|class)<\/span> (\w+)/g,'$1</span> <span class="pyf">$2</span>');

}
