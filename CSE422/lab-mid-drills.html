  if(busy){ worker.terminate(); worker = null; pyReady = false; busy = false; pending = {d, code, cb}; ensureWorker(); return; }
  busy = true; currentCb = cb;
  worker.postMessage({prelude: d.prelude, solution: d.solution, postlude: d.postlude, tests: d.tests, student: code.endsWith('\n') ? code : code + '\n'});
  timeoutId = setTimeout(() => { if(busy){ worker.terminate(); worker = null; pyReady = false; busy = false; const c = currentCb; currentCb = null; c && c({verdict:'error', msg:'Timed out after 25 s — probably an infinite loop (while without progress, or recursion that never reaches depth 0).', out:''}); ensureWorker(); } }, 25000);
}
// ---------- drill UI ----------
function labDrills(lab){ return DRILLS.filter(d => d.lab === lab); }
function renderLab(lab){
  const sec = document.getElementById('tab-lab'+lab);
  const intro = CONTENT.labintro[lab];
  sec.innerHTML = `<div class="card"><h2 style="margin-top:0">${intro.title}</h2><p>${intro.text}</p><div id="labhead-${lab}"></div></div>
    <div class="grid" id="grid-${lab}"></div><div id="drill-${lab}"></div>`;
  refreshLab(lab);
}
function refreshLab(lab){
  const ds = labDrills(lab); const done = ds.filter(d => passed[d.id]).length;
  document.getElementById('labhead-'+lab).innerHTML = `<div class="small">${done}/${ds.length} drills passed</div><div class="progress"><i style="width:${(100*done/ds.length)|0}%"></i></div>`;
  const grid = document.getElementById('grid-'+lab); grid.innerHTML = '';
  ds.forEach((d, i) => {
    const c = document.createElement('div'); c.className = 'dcard';
    c.innerHTML = `<div><span class="${tagClass(d.tag)}">${d.tag}</span> ${passed[d.id] ? '<span class="tag done">passed</span>' : ''}</div><div class="t">${i+1}. ${esc(d.title)}</div><div class="s">${esc(d.summary)}</div>`;
    c.onclick = () => openDrill(d, 'drill-'+lab, 'lab'+lab);
    grid.appendChild(c);
  });
}
function openDrill(d, hostId, tab, opts={}){
  const host = document.getElementById(hostId);
  const draft = drafts[d.id] != null ? drafts[d.id] : d.stub;
  host.innerHTML = `
  <div class="card" id="dv-${d.id}">
    <div class="crumb"><a onclick="document.getElementById('${hostId}').innerHTML='';window.scrollTo(0,0)">← back to the list</a></div>
    <div><span class="${tagClass(d.tag)}">${d.tag}</span> <span class="tag">Lab ${d.lab}</span></div>
    <h2 style="margin:6px 0">${esc(d.title)}</h2>
    <p>${esc(d.summary)}</p>
    <div class="editor-wrap">
      <div><h3>The program you are given (the yellow part is the blank)</h3>${programView(d)}
        <div class="small">Expected output:</div><pre>${esc(d.expected)}</pre></div>
      <div><h3>Your answer — replace the blank</h3>
        <textarea class="ed" id="ed-${d.id}" spellcheck="false">${esc(draft)}</textarea>
        <div class="btns">
          <button class="btn primary" id="run-${d.id}">Run &amp; check</button>
          <button class="btn" id="hint-${d.id}" ${opts.exam?'disabled':''}>Hint</button>
          <button class="btn" id="sol-${d.id}" ${opts.exam?'disabled':''}>Show solution</button>
          <button class="btn" id="reset-${d.id}">Reset</button>
        </div>
        <div id="hintbox-${d.id}" class="note hidden"></div>
        <div id="verdict-${d.id}" class="verdict wait">Not run yet. Write your code, then Run &amp; check. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> also runs.</div>
        <div id="outbox-${d.id}"></div>
        <div id="solbox-${d.id}" class="hidden"></div>
      </div>
    </div>
    <details ${opts.exam?'class="hidden"':''}><summary>Notes &amp; likely tweaks</summary><div class="note">${esc(d.notes)}</div>
      ${d.viva.length ? '<h3>Viva questions on this drill</h3><ol class="viva">'+d.viva.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ol>' : ''}</details>
  </div>`;
  const ed = host.querySelector('#ed-'+d.id);
  ed.addEventListener('keydown', e => {
    if(e.key === 'Tab'){ e.preventDefault(); const s = ed.selectionStart, t = ed.selectionEnd; ed.value = ed.value.slice(0,s)+'    '+ed.value.slice(t); ed.selectionStart = ed.selectionEnd = s+4; }
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); run(); }
  });
  ed.addEventListener('input', () => { drafts[d.id] = ed.value; store.set('drafts', drafts); });
  const vbox = host.querySelector('#verdict-'+d.id), obox = host.querySelector('#outbox-'+d.id);
  function run(){
    vbox.className = 'verdict wait'; vbox.textContent = pyReady ? 'Running…' : 'Loading Python (first run takes a few seconds)…'; obox.innerHTML = '';
    runGrade(d, ed.value, r => {
      vbox.className = 'verdict '+r.verdict;
      vbox.textContent = (r.verdict==='pass' ? '✔ PASS — ' : r.verdict==='fail' ? '✘ FAIL — ' : '⚠ ERROR — ') + r.msg;
      obox.innerHTML = (r.out ? '<div class="small">Your program printed:</div><pre>'+esc(r.out)+'</pre>' : '<div class="small">Your program printed nothing.</div>');
      if(r.verdict === 'pass'){ passed[d.id] = true; store.set('passed', passed); if(tab) refreshLab(d.lab); renderPlanProgress(); }
      if(opts.onResult) opts.onResult(r);
    });
  }
  host.querySelector('#run-'+d.id).onclick = run;
  host.querySelector('#hint-'+d.id).onclick = () => { const h = host.querySelector('#hintbox-'+d.id); h.classList.remove('hidden'); h.textContent = d.hint; };
  host.querySelector('#sol-'+d.id).onclick = () => { const s = host.querySelector('#solbox-'+d.id); s.classList.remove('hidden'); s.innerHTML = '<div class="small">Reference solution:</div>'+codeBlock(d.solution)+'<button class="btn" id="use-'+d.id+'">Paste into editor</button>'; s.querySelector('#use-'+d.id).onclick = () => { ed.value = d.solution; drafts[d.id] = ed.value; store.set('drafts', drafts); }; };
  host.querySelector('#reset-'+d.id).onclick = () => { ed.value = d.stub; delete drafts[d.id]; store.set('drafts', drafts); };
  if(!opts.noscroll) window.scrollTo(0, host.offsetTop - 110);
  ensureWorker();
}
// ---------- plan tab ----------
function renderPlan(){
  const sec = document.getElementById('tab-plan');
  const total = DRILLS.length, done = Object.keys(passed).filter(k => DRILLS.some(d=>d.id===k)).length;
  sec.innerHTML = `
  <div class="card"><h2 style="margin-top:0">What the lab mid actually looks like</h2>
  <p>${CONTENT.format}</p>
  <div class="note warn"><b>Announcement:</b> 3 December, 11:15, with your section. 8 marks. Strictly coding — marks come from the code you write, plus a small viva to explain it. Python only. "Practice basic Python syntax required for the topics."</div>
  <div id="planprog"></div>
  </div>
  <div class="card"><h2 style="margin-top:0">What to practise, in order</h2>
  <table><thead><tr><th>Skill</th><th>Evidence</th><th>Priority</th></tr></thead><tbody>
  ${CONTENT.evidence.map(([s,e,p]) => `<tr><td>${esc(s)}</td><td>${esc(e)}</td><td class="prio-${p.split(' ')[0]}">${p}</td></tr>`).join('')}
  </tbody></table>
  <p><b>Suggested routine</b> (about 40 minutes a day):</p>
  <ol><li>Do the three <span class="tag hot">REAL ASSESSMENT</span> drills until you can write each blank from memory in under 4 minutes, without the hint.</li>
  <li>Do every <span class="tag hot">HIGH PROBABILITY</span> and <span class="tag">ASSIGNMENT CORE</span> drill once with hints, then once clean.</li>
  <li>From then on, use <b>Mock exam</b> daily: it hides hints and solutions and gives you a random blank with a 10-minute timer, exactly like the real thing.</li>
  <li>The day before: read the <b>Viva</b> tab and the <b>Python cheat sheet</b>; redo any drill you ever failed.</li></ol>
  <p class="small">${CONTENT.offline}</p>
  </div>
  <h2>The three real assessment papers, with the answers they leave blank</h2>
  ${CONTENT.papers.map(p => `<div class="card"><h3 style="margin-top:0">${esc(p.title)}</h3>
    <p><b>What is blanked:</b> ${esc(p.blank)}</p>
    <p><b>Given:</b> <code>${esc(p.graph)}</code></p>
    <details><summary>Expected output (the paper prints "?")</summary><pre>${esc(p.answer)}</pre><p>${esc(p.why)}</p></details>
    <button class="btn primary" onclick="jumpTo('${p.drill}')">Practise this blank →</button></div>`).join('')}`;
}
function renderPlanProgress(){ const el = document.getElementById('planprog'); if(!el) return; const total = DRILLS.length, done = Object.keys(passed).filter(k => DRILLS.some(d=>d.id===k)).length; el.innerHTML = `<div class="small">Overall progress: ${done}/${total} drills passed</div><div class="progress"><i style="width:${(100*done/total)|0}%"></i></div>`; }
function jumpTo(id){ const d = DRILLS.find(x => x.id === id); showTab('lab'+d.lab); openDrill(d, 'drill-'+d.lab, 'lab'+d.lab); }
// ---------- mock exam ----------
let mock = null;
function renderMock(){
  const sec = document.getElementById('tab-mock');
  const log = store.get('mocklog', []);
  sec.innerHTML = `<div class="card"><h2 style="margin-top:0">Mock exam</h2>
  <p>A random blank from the labs you choose, 10 minutes on the clock, no hint and no solution until you submit or time runs out. The real exam gives roughly this: a full program, one or a few TODOs, an expected output to match.</p>
  <div class="btns">
    <label class="pill"><input type="checkbox" class="mlab" value="1" checked> Lab 1</label>
    <label class="pill"><input type="checkbox" class="mlab" value="2" checked> Lab 2</label>
    <label class="pill"><input type="checkbox" class="mlab" value="3" checked> Lab 3</label>
    <label class="pill">Minutes <input type="number" id="mockmin" value="10" min="2" max="45" style="width:56px"></label>
    <button class="btn primary" id="mockstart">Start a random question</button>
  </div>
  <div id="mockarea"></div>
  <h3>Your mock history</h3>
  ${log.length ? '<table><thead><tr><th>When</th><th>Drill</th><th>Result</th><th>Time used</th></tr></thead><tbody>'+log.slice().reverse().slice(0,25).map(r=>`<tr><td>${esc(r.when)}</td><td>${esc(r.title)}</td><td class="${r.verdict==='pass'?'prio-medium':'prio-very'}">${r.verdict}</td><td>${r.secs}s</td></tr>`).join('')+'</tbody></table>' : '<p class="small">No mocks yet.</p>'}
  </div>`;
  sec.querySelector('#mockstart').onclick = () => {
    const labs = [...sec.querySelectorAll('.mlab:checked')].map(x => +x.value);
    const pool = DRILLS.filter(d => labs.includes(d.lab));
    if(!pool.length){ alert('Pick at least one lab'); return; }
    // prefer drills not yet passed in a mock
    const d = pool[Math.floor(Math.random()*pool.length)];
    startMock(d, +sec.querySelector('#mockmin').value || 10);
  };
}
function startMock(d, minutes){
  if(mock && mock.iv) clearInterval(mock.iv);
  const area = document.getElementById('mockarea');
  area.innerHTML = `<div class="card"><div class="two"><div><div class="small">Time left</div><div class="timer" id="mocktimer"></div></div><div><div class="small">Rules</div><div>Write the blank. Press <b>Run &amp; check</b> as often as you like — the clock keeps running. Your first PASS, or the end of the clock, ends the attempt.</div></div></div></div><div id="mockdrill"></div>`;
  const start = Date.now(), end = start + minutes*60000; let finished = false;
  const t = document.getElementById('mocktimer');
  function tick(){ const left = Math.max(0, end - Date.now()); const m = Math.floor(left/60000), s = Math.floor(left%60000/1000); t.textContent = m+':'+String(s).padStart(2,'0'); t.classList.toggle('low', left < 60000); if(left <= 0 && !finished){ finish('timeout'); } }
  mock = { iv: setInterval(tick, 500) }; tick();
  function finish(verdict){
    finished = true; clearInterval(mock.iv);
    const secs = Math.round((Date.now()-start)/1000);
    const log = store.get('mocklog', []); log.push({when: new Date().toLocaleString(), title: 'Lab '+d.lab+' — '+d.title, verdict, secs}); store.set('mocklog', log);
    const box = document.createElement('div'); box.className = 'card';
    box.innerHTML = `<h3 style="margin-top:0">${verdict==='pass' ? '✔ Passed in '+secs+' s' : verdict==='timeout' ? '⏰ Time is up' : '✘ Submitted without passing'}</h3><p>Hint and solution are now unlocked below. <button class="btn" onclick="renderMock();showTab('mock')">Another question</button></p>`;
    area.prepend(box);
    ['hint-','sol-'].forEach(p => { const b = document.getElementById(p+d.id); if(b) b.disabled = false; });
    document.querySelectorAll('#mockdrill details.hidden').forEach(x => x.classList.remove('hidden'));
  }
  openDrill(d, 'mockdrill', null, { exam: true, noscroll: true, onResult: r => { if(!finished && r.verdict === 'pass') finish('pass'); } });
  const give = document.createElement('button'); give.className = 'btn'; give.textContent = 'Give up / submit as is'; give.onclick = () => { if(!finished) finish('fail'); };
  document.querySelector('#mockdrill .btns').appendChild(give);
}
// ---------- cheat sheet & viva ----------
function renderCheat(){
  document.getElementById('tab-cheat').innerHTML = `<div class="card"><h2 style="margin-top:0">Python you must be able to type without thinking</h2><p>The announcement says it directly: practise the basic syntax the topics need. These are the exact idioms the lab programs are built from.</p></div>` +
    CONTENT.cheats.map(([t, c]) => `<div class="card"><h3 style="margin-top:0">${esc(t)}</h3>${codeBlock(c)}</div>`).join('');
}
function renderViva(){
  const fromDrills = DRILLS.flatMap(d => d.viva.map(v => [d.title, v]));
  document.getElementById('tab-viva').innerHTML = `<div class="card"><h2 style="margin-top:0">Viva — explain your work</h2><p>Short answers you can say in one breath. Click a question to reveal the answer.</p>

  <h3>Questions tied to specific drills</h3>
  ${fromDrills.map(([t,v]) => `<details><summary>${esc(v.split(' (')[0])}</summary><div class="note"><b>${esc(t)}:</b> ${esc(v)}</div></details>`).join('')}
  </div>`;
}
// ---------- boot ----------
renderPlan(); renderPlanProgress(); renderLab(1); renderLab(2); renderLab(3); renderMock(); renderCheat(); renderViva();
showTab(store.get('tab', 'plan'));
ensureWorker();
